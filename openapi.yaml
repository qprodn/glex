                 and the last menu WeChat accepted. Neither is a secret. Permission:
                 wechat:app:list.
            operationId: WechatService_GetWechatAppMenu
            parameters:
                - name: appId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/wechat.v1.WechatAppMenu'
        put:
            tags:
                - WechatService
            description: |-
                SaveWechatAppMenu stores the Custom Menu in this system and does not
                 call WeChat. The last menu WeChat accepted stays as it was.
                 Permission: wechat:app:update.
            operationId: WechatService_SaveWechatAppMenu
            parameters:
                - name: appId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/wechat.v1.SaveWechatAppMenuRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/wechat.v1.WechatAppMenu'
    /wechat/app/{appId}/menu/publish:
        post:
            tags:
                - WechatService
            description: |-
                PublishWechatAppMenu sends the whole saved menu and replaces that
                 Service Account's default menu at WeChat. A business refusal or a
                 timeout leaves the previously accepted menu in place and does not
                 lapse the app. A definitive refusal lapses the app and still leaves
                 that menu. Permission: wechat:app:update.
            operationId: WechatService_PublishWechatAppMenu
            parameters:
                - name: appId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/wechat.v1.PublishWechatAppMenuRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/wechat.v1.WechatAppMenu'
    /wechat/app/{appId}/probe:
        post:
            tags:
                - WechatService
            description: |-
                ProbeWechatApp runs the WeChat Connectivity Test for one app. The
                 test uses the app's current token and creates no WeChat Dispatch. A
                 definitive refusal lapses the app. A timeout, a business rejection,
                 or an unready platform fails the test and leaves the app unlapsed.
                 A lapsed app is refused until it is restored. A suspended app can
                 still be tested. Permission: wechat:app:probe.
            operationId: WechatService_ProbeWechatApp
            parameters:
                - name: appId
                  in: path
                  description: Required. The id of the app to test.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/wechat.v1.ProbeWechatAppRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/wechat.v1.ProbeWechatAppResult'
    /wechat/app/{appId}/push-secret:
        post:
            tags:
                - WechatService
            description: |-
                RegenerateWechatAppPushSecret replaces the Push Secret. The response
                 returns the new pair in full once. The previous pair is invalidated
                 immediately. The app is not withdrawn and its suspension is unchanged.
            operationId: WechatService_RegenerateWechatAppPushSecret
            parameters:
                - name: appId
                  in: path
                  description: Required. The id of the Direct Hold whose Push Secret is regenerated.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/wechat.v1.RegenerateWechatAppPushSecretRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/wechat.v1.WechatAppPushSecret'
    /wechat/app/{appId}/suspended:
        post:
            tags:
                - WechatService
            description: |-
                SetWechatAppSuspended suspends or resumes the app. The app stays on
                 the live list either way.
            operationId: WechatService_SetWechatAppSuspended
            parameters:
                - name: appId
                  in: path
                  description: Required. The id of the app.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/wechat.v1.SetWechatAppSuspendedRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/wechat.v1.WechatApp'
    /wechat/mini-program/login:
        post:
            tags:
                - WechatService
            description: |-
                MiniProgramLogin exchanges one mini program's one-time login code for
                 that WeChat App's openid and, when WeChat supplied one, its unionid.
                 Direct Hold and Platform Authorization share this entry; the caller
                 does not name the connection. No back-office Principal and no menu
                 permission are required. The response carries no session_key and no
                 system credential. The call creates no WeChat User, System User, or
                 Login Session, and it writes no Login Log.
            operationId: WechatService_MiniProgramLogin
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/wechat.v1.MiniProgramLoginRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/wechat.v1.MiniProgramIdentity'
    /wechat/platform:
        get:
            tags:
                - WechatService
            description: |-
                ListWechatPlatforms lists platforms that are not withdrawn. Responses
                 carry masks only.
            operationId: WechatService_ListWechatPlatforms
            parameters:
                - name: pageSize
                  in: query
                  description: Optional. Page size.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: Optional. Page token from a previous response.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Optional. AIP-160 filter. Supported fields:
                       * `name` (e.g. `name="华东平台"`, exact)
                       * `component_app_id` (e.g. `component_app_id="wx123"`)
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: Optional. AIP-132 order, e.g. `id desc` (the default).
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/wechat.v1.WechatPlatformSet'
        post:
            tags:
                - WechatService
            description: |-
                CreateWechatPlatform registers a platform. The response carries masks,
                 never the secrets the operator just typed.
            operationId: WechatService_CreateWechatPlatform
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/wechat.v1.CreateWechatPlatformRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/wechat.v1.WechatPlatform'
    /wechat/platform/{platformId}:
        get:
            tags:
                - WechatService
            description: GetWechatPlatform retrieves one platform that is not withdrawn.
            operationId: WechatService_GetWechatPlatform
            parameters:
                - name: platformId
                  in: path
                  description: Required. The id of the platform to retrieve.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/wechat.v1.WechatPlatform'
        delete:
            tags:
                - WechatService
            description: |-
                WithdrawWechatPlatform soft-deletes the platform. The row leaves the
                 live list; it is not hard-deleted.
            operationId: WechatService_WithdrawWechatPlatform
            parameters:
                - name: platformId
                  in: path
                  description: Required. The id of the platform to withdraw.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
        patch:
            tags:
                - WechatService
            description: |-
                UpdateWechatPlatform corrects the display name and, when a secret is
                 non-blank, replaces that secret. A component AppID that differs from
                 the stored value is refused. Blank secrets keep their stored values.
            operationId: WechatService_UpdateWechatPlatform
            parameters:
                - name: platformId
                  in: path
                  description: Required. The id of the platform to update.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/wechat.v1.UpdateWechatPlatformRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/wechat.v1.WechatPlatform'
    /wechat/platform/{platformId}/probe:
        post:
            tags:
                - WechatService
            description: |-
                ProbeWechatPlatform runs the WeChat Connectivity Test for one platform.
                 A platform that is missing a secret or a verify ticket fails the test.
                 Success and failure change no WeChat App. Permission: wechat:platform:probe.
            operationId: WechatService_ProbeWechatPlatform
            parameters:
                - name: platformId
                  in: path
                  description: Required. The id of the platform to test.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/wechat.v1.ProbeWechatPlatformRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/wechat.v1.ProbeWechatPlatformResult'
components:
    schemas:
        access.v1.Menu:
            type: object
            properties:
                menuId:
                    type: string
                    description: Snowflake ID. Server-assigned on create.
                menuName:
                    type: string
                parentId:
                    type: string
                    description: Parent menu id; 0 = root.
                orderNum:
                    type: integer
                    format: int32
                path:
                    type: string
                    description: The routing fields below are inert until GetRouters consumes them.
                component:
                    type: string
                queryParam:
                    type: string
                isFrame:
                    type: integer
                    description: 0否 1是 (external link).
                    format: int32
                isCache:
                    type: integer
                    description: 0不缓存 1缓存.
                    format: int32
                menuType:
                    type: integer
                    format: enum
                visible:
                    type: integer
                    description: 0显示 1隐藏.
                    format: int32
                status:
                    type: integer
                    description: 0正常 1停用.
                    format: int32
                perms:
                    type: string
                    description: |-
                        Permission handle (e.g. "system:user:list"); enforced against the
                         Principal's Functional Permissions.
                icon:
                    type: string
                activeMenu:
                    type: string
                ext:
                    type: string
                createBy:
                    type: string
                    description: Audit; filled from the authenticated identity.
                updateBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/access.v1.Menu'
                    description: 'Read-only: populated by ListMenus (the tree), ignored on Create/Update.'
            description: |-
                Menu is a menu node (菜单), ported from RuoYi sys_menu. Back-office CRUD +
                 tree plus the current System User's route projection (GetRouters).
        access.v1.MenuTree:
            type: object
            properties:
                menus:
                    type: array
                    items:
                        $ref: '#/components/schemas/access.v1.Menu'
            description: MenuTree is a forest of root menus, each nesting its descendants.
        access.v1.Role:
            type: object
            properties:
                roleId:
                    type: string
                    description: Snowflake ID. Server-assigned on create.
                roleName:
                    type: string
                    description: Role name. Required, non-blank; unique among active roles.
                roleKey:
                    type: string
                    description: |-
                        Permission string (e.g. "superadmin" or "data:scope:read"). Required,
                         non-blank; unique among active roles. No charset rule.
                roleSort:
                    type: integer
                    description: Display order. Defaults to 0; not required (0 is legal).
                    format: int32
                status:
                    type: integer
                    description: 0正常 1停用 (per RuoYi). Ordinary updatable field.
                    format: int32
                remark:
                    type: string
                createBy:
                    type: string
                    description: 'Audit: who created/updated. Filled from the authenticated identity.'
                updateBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                menuCheckStrictly:
                    type: boolean
                    description: |-
                        Whether the role editor treats parent/child menu selection as linked
                         (菜单选择是否关联显示). Defaults to on (RuoYi column default 1). Shown by
                         GetRole/ListRoles; NOT writable through UpdateRole — it is written only
                         via UpdateRoleMenus (the permission save), like Menu.children is
                         read-only on Create/Update.
            description: |-
                Role is a named bundle of permissions (角色), ported from RuoYi sys_role.
                 Back-office CRUD plus the role↔menu link (**Menu Grant**); user↔role and
                 data-scope links are deferred (see GLOSSARY.md).
        access.v1.RoleAssignment:
            type: object
            properties:
                role:
                    allOf:
                        - $ref: '#/components/schemas/access.v1.Role'
                    description: The role itself.
                assigned:
                    type: boolean
                    description: Whether the user currently holds this role.
            description: |-
                RoleAssignment is one role with whether the user is assigned it (RuoYi's
                 authRole dialog data: all roles plus a checked flag).
        access.v1.RoleMenus:
            type: object
            properties:
                menuIds:
                    type: array
                    items:
                        type: string
            description: 'RoleMenus is a role''s Menu Grant: the full set of granted menu ids.'
        access.v1.RoleSet:
            type: object
            properties:
                roles:
                    type: array
                    items:
                        $ref: '#/components/schemas/access.v1.Role'
                nextPageToken:
                    type: string
                    description: Opaque token for the next page; empty when on the last page.
            description: RoleSet is a page of roles.
        access.v1.Router:
            type: object
            properties:
                name:
                    type: string
                path:
                    type: string
                hidden:
                    type: boolean
                redirect:
                    type: string
                component:
                    type: string
                query:
                    type: string
                alwaysShow:
                    type: boolean
                meta:
                    $ref: '#/components/schemas/access.v1.RouterMeta'
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/access.v1.Router'
            description: |-
                Router is one Directory/Menu node in the current System User's route tree.
                 Button nodes are never projected as Router values.
        access.v1.RouterMeta:
            type: object
            properties:
                title:
                    type: string
                icon:
                    type: string
                noCache:
                    type: boolean
                link:
                    type: string
                activeMenu:
                    type: string
            description: RouterMeta contains route presentation metadata consumed by the frontend.
        access.v1.RouterTree:
            type: object
            properties:
                routers:
                    type: array
                    items:
                        $ref: '#/components/schemas/access.v1.Router'
            description: RouterTree is the current System User's route forest.
        access.v1.UpdateRoleMenusRequest:
            required:
                - roleId
            type: object
            properties:
                roleId:
                    type: string
                    description: Required. The id of the role whose grant is replaced.
                menuIds:
                    type: array
                    items:
                        type: string
                    description: The complete desired grant; full replacement (empty = clear all).
                menuCheckStrictly:
                    type: boolean
                    description: |-
                        Optional. Presence-aware; absent = true (RuoYi default). Written together
                         with the grant in the same transaction.
        access.v1.UpdateUserRolesRequest:
            required:
                - userId
            type: object
            properties:
                userId:
                    type: string
                    description: Required. The id of the user whose assignment is replaced.
                roleIds:
                    type: array
                    items:
                        type: string
                    description: The complete desired assignment; full replacement (empty = clear all).
        access.v1.UserRoles:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/access.v1.RoleAssignment'
            description: |-
                UserRoles is a user's Role Assignment (角色分配): every active role with its
                 assigned flag, ordered by (role_sort, role_id). Not paginated — roles are a
                 small flat set.
        audit.v1.LoginLog:
            type: object
            properties:
                loginLogId:
                    type: string
                    description: Snowflake ID. Server-assigned on record.
                userId:
                    type: string
                    description: |-
                        The account the event is about; 0 when the attempt never resolved to an
                         account (wrong name, withdrawn user).
                userName:
                    type: string
                ipaddr:
                    type: string
                browser:
                    type: string
                os:
                    type: string
                status:
                    type: integer
                    format: enum
                msg:
                    type: string
                    description: Human-readable outcome ("登录成功", "密码错误", "强制退出").
                createdAt:
                    type: string
                    format: date-time
            description: |-
                LoginLog is one recorded sign-in or session end (登录日志), ported from
                 RuoYi sys_logininfor (renamed sys_login_log). authn writes the row at the
                 moment the outcome is known (ADR 0012); rows are write-once and only ever
                 withdrawn. The account is denormalized (id + name) so a failed attempt for
                 a nonexistent account still records the attempted name.
        audit.v1.LoginLogSet:
            type: object
            properties:
                loginLogs:
                    type: array
                    items:
                        $ref: '#/components/schemas/audit.v1.LoginLog'
                nextPageToken:
                    type: string
                    description: Opaque token for the next page; empty when on the last page.
            description: LoginLogSet is a page of login logs.
        audit.v1.OperLog:
            type: object
            properties:
                operLogId:
                    type: string
                    description: Snowflake ID. Server-assigned on record.
                operation:
                    type: string
                    description: Kratos operation name (e.g. "/iam.v1.UserService/CreateUser").
                httpMethod:
                    type: string
                operUserId:
                    type: string
                    description: Operator; 0 = an unauthenticated actor.
                operUserName:
                    type: string
                    description: Denormalized operator account name.
                ipaddr:
                    type: string
                request:
                    type: string
                    description: Redacted request payload as protojson.
                status:
                    type: integer
                    format: enum
                reason:
                    type: string
                    description: Kratos error reason; empty on success.
                errorMsg:
                    type: string
                latencyMs:
                    type: string
                requestId:
                    type: string
                    description: Correlates with the structured request log.
                createdAt:
                    type: string
                    format: date-time
            description: |-
                OperLog is the monitoring record of one mutating operation (操作日志),
                 ported from RuoYi sys_oper_log. The transport middleware mints one row per
                 recorded request after the handler returns (ADR 0012); rows are write-once
                 and only ever withdrawn. RuoYi's title/method/oper_url collapse into the
                 kratos operation name; the operator is denormalized so history survives
                 account withdrawal. Request payloads carry no secrets (scrubbed, ADR 0012).
        audit.v1.OperLogSet:
            type: object
            properties:
                operLogs:
                    type: array
                    items:
                        $ref: '#/components/schemas/audit.v1.OperLog'
                nextPageToken:
                    type: string
                    description: Opaque token for the next page; empty when on the last page.
            description: OperLogSet is a page of oper logs.
        authn.v1.IssueLoginChallengeReply:
            type: object
            properties:
                challengeId:
                    type: string
                imagePng:
                    type: string
                    format: bytes
            description: |-
                IssueLoginChallengeReply is one freshly issued Login Challenge. image_png is
                 the picture the caller must read; the answer stays on the server.
        authn.v1.LoginReply:
            type: object
            properties:
                accessToken:
                    type: string
                expireIn:
                    type: string
                    description: Remaining fixed lifetime in seconds.
            description: |-
                LoginReply returns the bearer credential exactly once, at login. The token
                 is never included in Principal or OnlineSession.
        authn.v1.LoginRequest:
            required:
                - username
                - password
            type: object
            properties:
                username:
                    type: string
                password:
                    type: string
                challengeId:
                    type: string
                challengeAnswer:
                    type: string
            description: |-
                LoginRequest contains the credentials used to create one Login Session.
                 challenge_id and challenge_answer are required by the login flow, but they
                 are not field_behavior REQUIRED: a missing value is LOGIN_CHALLENGE_INVALID,
                 the same reason as a wrong, expired, or already-spent Login Challenge, and
                 the required-field middleware would turn an absence into a different error.
        authn.v1.OnlineSession:
            type: object
            properties:
                tokenId:
                    type: string
                userName:
                    type: string
                deviceType:
                    type: string
                ipaddr:
                    type: string
                browser:
                    type: string
                os:
                    type: string
                loginTime:
                    type: string
                    format: date-time
            description: |-
                OnlineSession is the safe management view of one Login Session. token_id is
                 the non-secret Session ID retained for RuoYi-compatible JSON naming.
        authn.v1.OnlineSessionSet:
            type: object
            properties:
                sessions:
                    type: array
                    items:
                        $ref: '#/components/schemas/authn.v1.OnlineSession'
                nextPageToken:
                    type: string
            description: OnlineSessionSet is a page of active Login Sessions.
        dict.v1.DictEntry:
            type: object
            properties:
                entryId:
                    type: string
                    description: Snowflake ID. Server-assigned on create.
                dictType:
                    type: string
                    description: |-
                        Owning Dict Type key (e.g. "sys_normal_disable"). Required; must
                         reference an active type; immutable after create.
                dictLabel:
                    type: string
                    description: Display label (e.g. "正常"). Required, non-blank.
                dictValue:
                    type: string
                    description: |-
                        Machine value (e.g. "0"). Required, non-blank; unique within the type
                         among active entries.
                dictSort:
                    type: integer
                    description: Display order. Defaults to 0; smaller first.
                    format: int32
                tagStyle:
                    type: integer
                    description: Tag color preset for list rendering (RuoYi list_class).
                    format: enum
                isDefault:
                    type: boolean
                    description: |-
                        Whether forms should preselect this option. Multiple defaults may
                         coexist (RuoYi semantics); consumers take the first by sort.
                remark:
                    type: string
                createBy:
                    type: string
                    description: 'Audit: who created/updated. Filled from the authenticated identity.'
                updateBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                DictEntry is one labeled option inside a Dict Type (字典项), ported from
                 RuoYi sys_dict_data (the domain noun was renamed; the table keeps RuoYi's
                 name — see GLOSSARY.md). The owning type key is set at create and not
                 updatable (ADR 0006): UpdateDictEntry ignores it.
        dict.v1.DictEntryOption:
            type: object
            properties:
                value:
                    type: string
                    description: Machine value.
                label:
                    type: string
                    description: Display label.
                tagStyle:
                    type: integer
                    description: Tag color preset.
                    format: enum
                isDefault:
                    type: boolean
                    description: Whether forms should preselect this option.
            description: |-
                DictEntryOption is the lightweight consumption view of a Dict Entry: the
                 four fields a select or status tag needs, nothing else. Returned by
                 ListDictEntriesByType, which any authenticated principal may call — audit
                 fields never appear here.
        dict.v1.DictEntryOptionSet:
            type: object
            properties:
                options:
                    type: array
                    items:
                        $ref: '#/components/schemas/dict.v1.DictEntryOption'
            description: DictEntryOptionSet is the ordered option list of one Dict Type.
        dict.v1.DictEntrySet:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/dict.v1.DictEntry'
                nextPageToken:
                    type: string
                    description: Opaque token for the next page; empty when on the last page.
            description: DictEntrySet is a page of dict entries.
        dict.v1.DictType:
            type: object
            properties:
                dictTypeId:
                    type: string
                    description: Snowflake ID. Server-assigned on create.
                dictName:
                    type: string
                    description: Display name (e.g. "系统启用停用"). Required, non-blank.
                dictType:
                    type: string
                    description: |-
                        Vocabulary key (e.g. "sys_normal_disable"). Required; must match
                         ^[a-z][a-z0-9_]*$ ; unique among active types. Immutable after create
                         (ADR 0006): UpdateDictType ignores it.
                remark:
                    type: string
                createBy:
                    type: string
                    description: 'Audit: who created/updated. Filled from the authenticated identity.'
                updateBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                DictType is a named, system-wide vocabulary of labeled options (字典类型),
                 ported from RuoYi sys_dict_type. The key (`dict_type`) is immutable once
                 created (ADR 0006); the display name and remark stay editable.
        dict.v1.DictTypeSet:
            type: object
            properties:
                dictTypes:
                    type: array
                    items:
                        $ref: '#/components/schemas/dict.v1.DictType'
                nextPageToken:
                    type: string
                    description: Opaque token for the next page; empty when on the last page.
            description: DictTypeSet is a page of dict types.
        file.v1.StoredFile:
            type: object
            properties:
                fileId:
                    type: string
                    description: |-
                        Snowflake ID. It also appears in the Stored Key, so the row and the
                         stored bytes correlate.
                originalName:
                    type: string
                    description: Original file name as uploaded.
                suffix:
                    type: string
                    description: Lowercased extension without the dot ("" when none).
                mimeType:
                    type: string
                    description: |-
                        Content type sniffed from the bytes at accept time; a client's declared
                         Content-Type never reaches this field.
                sizeBytes:
                    type: string
                bucket:
                    type: string
                objKey:
                    type: string
                    description: 'Stored Key: [<biz>/]yyyy/MM/dd/<snowflake>.<suffix>.'
                contentHash:
                    type: string
                    description: |-
                        Content Fingerprint: SHA-256 hex digest of the bytes. Recorded for
                         integrity; identical bytes accepted twice yield two Stored Files.
                createBy:
                    type: string
                    description: 'Audit: who created/updated. Filled from the authenticated identity.'
                updateBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                url:
                    type: string
                    description: |-
                        Display URL (展示链接): a presigned GET URL freshly signed at read time,
                         valid for the configured TTL (ADR 0016). Derived, never stored; empty
                         when signing failed — data responses never fail on display sugar.
            description: |-
                StoredFile is one file accepted into the system's storage (存储文件):
                 a metadata row paired with the bytes in object storage. Attachment
                 downloads address the bytes only through the service (ADR 0008), while
                 display rides the short-TTL presigned url (ADR 0016); withdrawal removes
                 the bytes while the row stays as audit history (ADR 0009).
        file.v1.StoredFileSet:
            type: object
            properties:
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/file.v1.StoredFile'
                nextPageToken:
                    type: string
                    description: Opaque token for the next page; empty when on the last page.
            description: StoredFileSet is a page of stored files.
        job.v1.Executor:
            type: object
            properties:
                name:
                    type: string
            description: |-
                Executor names one registered Job Executor (ADR 0023) — the save-time
                 validation's registry, surfaced for the console's handler picker.
        job.v1.ExecutorSet:
            type: object
            properties:
                executors:
                    type: array
                    items:
                        $ref: '#/components/schemas/job.v1.Executor'
            description: ExecutorSet is the registered executor list, sorted by name.
        job.v1.Job:
            type: object
            properties:
                jobId:
                    type: string
                    description: Snowflake ID. Server-assigned on create.
                name:
                    type: string
                    description: Display name, unique among active jobs. Required, non-blank.
                handler:
                    type: string
                    description: |-
                        Registered executor name (e.g. "pay.expire-sweep"). Required; validated
                         against the live registry on create and update.
                cron:
                    type: string
                    description: |-
                        5-field cron expression (robfig ParseStandard syntax, descriptors
                         included). Required.
                args:
                    type: string
                    description: Opaque executor argument, passed verbatim to Run.
                enabled:
                    type: boolean
                    description: |-
                        false pauses the schedule; a run already in flight finishes. Manual
                         runs are allowed on paused jobs. On CreateJob, unset is stamped true
                         (new jobs fire by default) — proto3 bools carry no presence, so the
                         optional marker is what lets the server tell "left unset" from an
                         explicit pause-at-create.
                timeoutSeconds:
                    type: integer
                    description: |-
                        Per-run timeout in seconds (1-3600). Server stamps the configured
                         default when the create request leaves it unset.
                    format: int32
                remark:
                    type: string
                createBy:
                    type: string
                    description: 'Audit: who created/updated. Filled from the authenticated identity.'
                updateBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                Job is a Scheduled Job (定时任务, ADR 0023): a recurring firing of one
                 registered Job Executor on a 5-field cron schedule, evaluated in the one
                 configured scheduler timezone. The handler must name a registered
                 executor at save time; the row never carries executable text.
        job.v1.JobLog:
            type: object
            properties:
                jobLogId:
                    type: string
                    description: Snowflake ID.
                jobId:
                    type: string
                    description: |-
                        The fired job. The job's withdrawal keeps its logs readable as
                         history.
                handler:
                    type: string
                    description: Snapshot of the job's handler at fire time.
                trigger:
                    type: integer
                    format: enum
                status:
                    type: integer
                    format: enum
                message:
                    type: string
                    description: Run summary or error text (bounded).
                startedAt:
                    type: string
                    format: date-time
                durationMs:
                    type: string
                    description: Run duration in milliseconds.
                createBy:
                    type: string
                updateBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                JobLog is the record of one completed firing (任务日志, ADR 0023):
                 written once at completion, queried and withdrawn, never updated.
        job.v1.JobLogSet:
            type: object
            properties:
                jobLogs:
                    type: array
                    items:
                        $ref: '#/components/schemas/job.v1.JobLog'
                nextPageToken:
                    type: string
                    description: Opaque token for the next page; empty when on the last page.
            description: JobLogSet is a page of job logs.
        job.v1.JobSet:
            type: object
            properties:
                jobs:
                    type: array
                    items:
                        $ref: '#/components/schemas/job.v1.Job'
                nextPageToken:
                    type: string
                    description: Opaque token for the next page; empty when on the last page.
            description: JobSet is a page of jobs.
        job.v1.SetJobEnabledRequest:
            required:
                - jobId
                - enabled
            type: object
            properties:
                jobId:
                    type: string
                    description: Required. The id of the job to resume or pause.
                enabled:
                    type: boolean
                    description: Required. true resumes the schedule, false pauses it.
        org.v1.Dept:
            type: object
            properties:
                deptId:
                    type: string
                    description: Snowflake ID. Server-assigned on create.
                parentId:
                    type: string
                    description: Parent department id; 0 = root.
                deptName:
                    type: string
                    description: Department name. Required, non-blank; unique among siblings.
                orderNum:
                    type: integer
                    description: Display order. Defaults to 0; not required (0 is legal).
                    format: int32
                leader:
                    type: string
                    description: |-
                        Leader as a System User id; 0 = none. Display-only: never validated
                         against sys_user (the editor restricts the choices).
                phone:
                    type: string
                email:
                    type: string
                status:
                    type: integer
                    description: 0正常 1停用 (per RuoYi). Ordinary updatable field.
                    format: int32
                createBy:
                    type: string
                    description: 'Audit: who created/updated. Filled from the authenticated identity.'
                updateBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/org.v1.Dept'
                    description: |-
                        Read-only: populated by ListDepts (the tree), ignored on Create/Update.
                         Ordered by order_num.
            description: |-
                Dept is a department (部门), ported from RuoYi sys_dept. The tree shape is
                 parent_id only (ADR 0014 — no materialized ancestors path); ListDepts
                 returns a server-built forest.
        org.v1.DeptTree:
            type: object
            properties:
                depts:
                    type: array
                    items:
                        $ref: '#/components/schemas/org.v1.Dept'
            description: DeptTree is a forest of root departments, each nesting its descendants.
        org.v1.DeptTreeOption:
            type: object
            properties:
                deptId:
                    type: string
                    description: The department id (the select's value).
                parentId:
                    type: string
                label:
                    type: string
                    description: The department name (the select's label).
                disabled:
                    type: boolean
                    description: True when the department is disabled (0正常 1停用 → selectable=false).
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/org.v1.DeptTreeOption'
            description: |-
                DeptTreeOption is one node of the lightweight department tree the selects
                 render (user form, post page). It carries no audit or contact data.
        org.v1.DeptTreeSelect:
            type: object
            properties:
                options:
                    type: array
                    items:
                        $ref: '#/components/schemas/org.v1.DeptTreeOption'
            description: DeptTreeSelect is the forest of DeptTreeOption nodes.
        org.v1.Post:
            type: object
            properties:
                postId:
                    type: string
                    description: Snowflake ID. Server-assigned on create.
                deptId:
                    type: string
                    description: The owning department. Required; validated to exist on save.
                postCode:
                    type: string
                    description: |-
                        Post code (e.g. "fe-dev"). Required, non-blank; globally unique among
                         active posts. No charset rule.
                postName:
                    type: string
                    description: |-
                        Post name (e.g. 前端开发). Required, non-blank; unique within its
                         department among active posts.
                postSort:
                    type: integer
                    description: Display order. Defaults to 0; not required (0 is legal).
                    format: int32
                status:
                    type: integer
                    description: 0正常 1停用 (per RuoYi). Ordinary updatable field.
                    format: int32
                remark:
                    type: string
                createBy:
                    type: string
                    description: 'Audit: who created/updated. Filled from the authenticated identity.'
                updateBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                Post is a position within one department (岗位), ported from RuoYi 6.0
                 sys_post — posts are department-scoped: the name is unique within its
                 department, the code is unique across all posts (ADR 0015).
        org.v1.PostAssignment:
            type: object
            properties:
                post:
                    allOf:
                        - $ref: '#/components/schemas/org.v1.Post'
                    description: The post itself.
                assigned:
                    type: boolean
                    description: Whether the user currently holds this post.
            description: |-
                PostAssignment is one post with whether the user is assigned it — the
                 user editor's post dialog data: the candidate posts of the effective
                 department plus a checked flag.
        org.v1.PostSet:
            type: object
            properties:
                posts:
                    type: array
                    items:
                        $ref: '#/components/schemas/org.v1.Post'
                nextPageToken:
                    type: string
                    description: Opaque token for the next page; empty when on the last page.
            description: PostSet is a page of posts.
        org.v1.UpdateUserPostsRequest:
            required:
                - userId
            type: object
            properties:
                userId:
                    type: string
                    description: Required. The id of the user whose assignment is replaced.
                postIds:
                    type: array
                    items:
                        type: string
                    description: The complete desired assignment; full replacement (empty = clear all).
        org.v1.UserPosts:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/org.v1.PostAssignment'
            description: |-
                UserPosts is a user's Post Assignment (岗位分配): the effective
                 department's active posts with their assigned flags, ordered by
                 (post_sort, post_id). Not paginated — a department's posts are a small
                 flat set.
        param.v1.Config:
            type: object
            properties:
                configId:
                    type: string
                    description: Snowflake ID. Server-assigned on create.
                configName:
                    type: string
                    description: Display name (e.g. "账号自助-是否开启用户注册功能"). Required, non-blank.
                configKey:
                    type: string
                    description: |-
                        Parameter key (e.g. "sys.account.registerUser"). Required; must match
                         ^[A-Za-z0-9][A-Za-z0-9._-]*$; unique among active parameters.
                configValue:
                    type: string
                    description: Parameter value, a plain string (booleans travel as "true"/"false").
                builtIn:
                    type: boolean
                    description: |-
                        Built-in Parameter: protected from withdrawal because the system assumes
                         it exists. Set at create and immutable afterwards — UpdateConfig ignores
                         it regardless of the mask; it governs withdrawability only.
                remark:
                    type: string
                createBy:
                    type: string
                    description: 'Audit: who created/updated. Filled from the authenticated identity.'
                updateBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                Config is a Runtime Parameter (运行时参数), ported from RuoYi sys_config: a
                 named, system-wide value an administrator changes at runtime without a
                 redeploy. Values are plain strings — parsing them is the consumer's job.
                 Unlike a Dict Type key, config_key stays editable after create (dict keys
                 are referenced by rows in the database, config keys only by consumer code;
                 see docs/modules/param.md).
        param.v1.ConfigSet:
            type: object
            properties:
                configs:
                    type: array
                    items:
                        $ref: '#/components/schemas/param.v1.Config'
                nextPageToken:
                    type: string
                    description: Opaque token for the next page; empty when on the last page.
            description: ConfigSet is a page of configs.
        pay.v1.ChangeMerchantAccountStatusRequest:
            required:
                - merchantId
                - status
            type: object
            properties:
                merchantId:
                    type: string
                    description: Required. The id of the Merchant Account.
                status:
                    type: integer
                    description: Required. 0 enabled, 1 disabled.
                    format: int32
        pay.v1.ChannelSchema:
            type: object
            properties:
                channel:
                    type: integer
                    format: int32
                name:
                    type: string
                    description: Stable code, e.g. "wechat", "alipay".
                label:
                    type: string
                    description: Display label, e.g. "微信支付".
                fields:
                    type: array
                    items:
                        $ref: '#/components/schemas/pay.v1.SchemaField'
                adopted:
                    type: boolean
                    description: True when an adapter is registered and the Channel can collect.
            description: |-
                ChannelSchema is one Channel's config schema — the single source the
                 merchant form renders and writes validate against (ADR 0021).
        pay.v1.ClosePaymentRequest:
            required:
                - paymentId
            type: object
            properties:
                paymentId:
                    type: string
                    description: Required. The Payment number to close.
        pay.v1.CreateMerchantAccountRequest:
            required:
                - channel
                - name
                - config
            type: object
            properties:
                channel:
                    type: integer
                    description: Required. The Channel to configure.
                    format: int32
                name:
                    type: string
                    description: Required. Display alias, unique per channel among active accounts.
                config:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Required. Config values keyed by the Channel schema's field names.
                         Validated server-side against the schema before encryption.
                remark:
                    type: string
                    description: Optional. Remark, ≤ 500 chars.
        pay.v1.CreatePaymentRequest:
            required:
                - merchantId
                - bizNo
                - subject
                - amount
            type: object
            properties:
                merchantId:
                    type: string
                    description: |-
                        Required. The Merchant Account to collect into; must exist and be
                         enabled, and its Channel must have a registered adapter.
                bizNo:
                    type: string
                    description: Required. Business Order Number — opaque caller reference, ≤ 64 chars.
                subject:
                    type: string
                    description: Required. Display subject, ≤ 256 chars.
                amount:
                    type: string
                    description: Required. Amount in minor units (fen), > 0.
                payMethod:
                    type: integer
                    description: Optional. 1 Native (the only MVP method); defaults to Native.
                    format: int32
                expireMinutes:
                    type: integer
                    description: |-
                        Optional. Expiry window in minutes; 0 or negative uses the 30-minute
                         default.
                    format: int32
        pay.v1.CreateRefundRequest:
            required:
                - paymentId
                - amount
            type: object
            properties:
                paymentId:
                    type: string
                    description: Required. The paid Payment to refund.
                amount:
                    type: string
                    description: Required. Refund amount in minor units; refunded + amount ≤ paid.
                reason:
                    type: string
                    description: Optional. Reason, ≤ 256 chars.
        pay.v1.GetChannelSchemasResponse:
            type: object
            properties:
                schemas:
                    type: array
                    items:
                        $ref: '#/components/schemas/pay.v1.ChannelSchema'
            description: GetChannelSchemasResponse lists every Channel the module knows.
        pay.v1.MerchantAccount:
            type: object
            properties:
                merchantId:
                    type: string
                    description: Snowflake ID.
                channel:
                    type: integer
                    description: 1 WeChat Pay, 2 Alipay, 3 UnionPay (reserved), 4 Stripe (reserved).
                    format: int32
                name:
                    type: string
                    description: Display alias, unique per channel among active accounts.
                status:
                    type: integer
                    description: 0 enabled, 1 disabled.
                    format: int32
                configMasked:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Masked echo of the channel config keyed by schema field name — secret
                         fields read like "****ab12", plain fields read verbatim. Display never
                         decrypts (ADR 0018).
                configDigest:
                    type: string
                    description: |-
                        SHA-256 hex of the canonical plaintext config; changes whenever the
                         config is rewritten.
                keyVersion:
                    type: integer
                    description: Master-key version the ciphertext was written under (ADR 0018).
                    format: int32
                remark:
                    type: string
                createBy:
                    type: string
                    description: 'Audit: who created/updated. Filled from the authenticated identity.'
                updateBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                MerchantAccount is one Channel Merchant Account (商户账号): the platform's
                 own collecting account at one Channel. The credential config is never
                 served — every response carries only config_masked, the write-time masked
                 echo (ADR 0018/0021).
        pay.v1.MerchantAccountSet:
            type: object
            properties:
                merchants:
                    type: array
                    items:
                        $ref: '#/components/schemas/pay.v1.MerchantAccount'
                nextPageToken:
                    type: string
                    description: Opaque token for the next page; empty when on the last page.
            description: MerchantAccountSet is a page of Merchant Accounts.
        pay.v1.Payment:
            type: object
            properties:
                paymentId:
                    type: string
                    description: Snowflake ID — the Payment number.
                merchantId:
                    type: string
                channel:
                    type: integer
                    description: Channel snapshot from the Merchant Account at initiation.
                    format: int32
                bizNo:
                    type: string
                    description: Business Order Number — the caller's opaque reference, not unique.
                subject:
                    type: string
                amount:
                    type: string
                    description: Minor units (fen for CNY). Always > 0.
                currency:
                    type: string
                    description: ISO 4217 code; the MVP channels collect CNY only.
                payMethod:
                    type: integer
                    description: 1 Native, 2 JSAPI, 3 H5, 4 App.
                    format: int32
                status:
                    type: integer
                    description: |-
                        1 PENDING, 2 PAID, 3 FAILED, 4 CLOSED, 5 EXPIRED — terminal states
                         are irreversible.
                    format: int32
                channelTradeNo:
                    type: string
                    description: Channel trade number (WeChat transaction_id / Alipay trade_no).
                channelPayload:
                    type: string
                    description: Channel prepay payload — the Native code_url a QR renders from.
                payerId:
                    type: string
                    description: Payer identity reported by the Channel (openid / buyer_id).
                refundedAmount:
                    type: string
                    description: Sum of successful refunds, minor units. Refunds never change status.
                failReason:
                    type: string
                expireTime:
                    type: string
                    description: |-
                        Judged lazily: a PENDING payment past this time settles to EXPIRED on
                         its next settlement-path touch (never on list reads).
                    format: date-time
                paidAt:
                    type: string
                    format: date-time
                createBy:
                    type: string
                    description: 'Audit: who created/updated. Filled from the authenticated identity.'
                updateBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                Payment is one attempt to collect a stated amount into one Merchant
                 Account through one Pay Method (支付单). The payment_id doubles as the
                 Channel's merchant order number. Amounts are int64 minor units (ADR 0019).
        pay.v1.PaymentSet:
            type: object
            properties:
                payments:
                    type: array
                    items:
                        $ref: '#/components/schemas/pay.v1.Payment'
                nextPageToken:
                    type: string
            description: PaymentSet is a page of Payments.
        pay.v1.ProbeMerchantAccountRequest:
            required:
                - merchantId
            type: object
            properties:
                merchantId:
                    type: string
                    description: Required. The id of the Merchant Account to probe.
        pay.v1.ProbeResult:
            type: object
            properties:
                ok:
                    type: boolean
                message:
                    type: string
                    description: Human-readable outcome; the failure reason when ok is false.
                latencyMs:
                    type: string
            description: |-
                ProbeResult reports one Connectivity Test (连通性测试): a cheap
                 authenticated Channel call that moves no money.
        pay.v1.QueryPaymentRequest:
            required:
                - paymentId
            type: object
            properties:
                paymentId:
                    type: string
                    description: Required. The Payment number to query at the Channel.
        pay.v1.QueryRefundRequest:
            required:
                - refundId
            type: object
            properties:
                refundId:
                    type: string
                    description: Required. The Refund number to query at the Channel.
        pay.v1.Refund:
            type: object
            properties:
                refundId:
                    type: string
                    description: Snowflake ID — the Refund number.
                paymentId:
                    type: string
                merchantId:
                    type: string
                channel:
                    type: integer
                    format: int32
                amount:
                    type: string
                    description: |-
                        This refund's amount, minor units; together all refunds of a Payment
                         never exceed its amount.
                reason:
                    type: string
                status:
                    type: integer
                    description: 1 PENDING, 2 SUCCESS, 3 FAILED.
                    format: int32
                channelRefundNo:
                    type: string
                failReason:
                    type: string
                refundedAt:
                    type: string
                    format: date-time
                createBy:
                    type: string
                    description: 'Audit: who created/updated. Filled from the authenticated identity.'
                updateBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                Refund is one request to return part or all of a paid Payment's amount
                 (退款单). The refund_id doubles as the Channel's merchant refund number.
        pay.v1.RefundSet:
            type: object
            properties:
                refunds:
                    type: array
                    items:
                        $ref: '#/components/schemas/pay.v1.Refund'
                nextPageToken:
                    type: string
            description: RefundSet is a page of Refunds.
        pay.v1.SchemaField:
            type: object
            properties:
                name:
                    type: string
                    description: Config key (the form field's name and the config JSON's key).
                label:
                    type: string
                type:
                    type: string
                required:
                    type: boolean
                secret:
                    type: boolean
                placeholder:
                    type: string
                help:
                    type: string
                group:
                    type: string
                    description: Form group label; fields render grouped in declaration order.
                choices:
                    type: array
                    items:
                        $ref: '#/components/schemas/pay.v1.SchemaOption'
                    description: Choices for select fields.
                defaultValue:
                    type: string
                    description: Default value for untouched fields.
            description: |-
                SchemaField is one field of a Channel's config schema — the unit the
                 merchant form renders. Types: text, password, textarea, select. Secret
                 fields are encrypted at rest, masked on every read, and scrubbed from
                 operation logs (ADR 0018); on update, a blank secret means "keep the
                 stored value".
        pay.v1.SchemaOption:
            type: object
            properties:
                value:
                    type: string
                label:
                    type: string
            description: SchemaOption is one labeled choice of a select field.
        pay.v1.UpdateMerchantAccountRequest:
            required:
                - merchantId
                - name
                - config
            type: object
            properties:
                merchantId:
                    type: string
                    description: Required. The id of the Merchant Account to update.
                name:
                    type: string
                    description: Required. New display alias.
                config:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Required. The whole config form. Secret fields left blank keep their
                         stored values; plain fields are replaced verbatim.
                remark:
                    type: string
                    description: Optional. New remark.
        user.v1.CurrentUser:
            type: object
            properties:
                userId:
                    type: string
                userName:
                    type: string
                nickName:
                    type: string
                email:
                    type: string
                phoneNumber:
                    type: string
                gender:
                    type: integer
                    format: int32
                status:
                    type: integer
                    format: int32
                avatarUrl:
                    type: string
                    description: |-
                        Read-only: the avatar's Display URL, freshly presigned on each read
                         (ADR 0016). Empty when the id is unset or unresolvable.
                remark:
                    type: string
                deptId:
                    type: string
                    description: The user's department; 0 = none (read-only, same as User.dept_id).
                avatar:
                    type: string
                    description: The avatar's Stored File id (read-only, same as User.avatar).
                createBy:
                    type: string
                updateBy:
                    type: string
                loginIp:
                    type: string
                loginDate:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                CurrentUser is the read-only, password-free System User shape returned by
                 GetInfo. A distinct DTO makes it impossible to expose the stored hash.
        user.v1.CurrentUserInfo:
            type: object
            properties:
                user:
                    $ref: '#/components/schemas/user.v1.CurrentUser'
                roleKeys:
                    type: array
                    items:
                        type: string
                permissions:
                    type: array
                    items:
                        type: string
            description: |-
                CurrentUserInfo is the authenticated System User and current Authorization
                 Snapshot exposed to the frontend.
        user.v1.ImportRowError:
            type: object
            properties:
                row:
                    type: integer
                    description: 1-based sheet row of the failing cell (the header is row 1).
                    format: int32
                column:
                    type: string
                    description: The column's header text.
                reason:
                    type: string
                    description: Human-readable reason in the operator's language.
        user.v1.ImportUsersRequest:
            required:
                - fileId
            type: object
            properties:
                fileId:
                    type: string
                    description: |-
                        Required. The Import File's Stored File id, from the file-module
                         upload (business prefix import/user).
        user.v1.ImportUsersResponse:
            type: object
            properties:
                importedCount:
                    type: string
                    description: Rows created. 0 whenever row_errors is non-empty — all-or-nothing.
                rowErrors:
                    type: array
                    items:
                        $ref: '#/components/schemas/user.v1.ImportRowError'
                    description: Every row-level failure; non-empty means nothing was imported.
        user.v1.User:
            type: object
            properties:
                userId:
                    type: string
                    description: Snowflake ID. Server-assigned on create.
                userName:
                    type: string
                    description: Login account. Unique.
                nickName:
                    type: string
                    description: Display name.
                email:
                    type: string
                    description: Email. Unique when set.
                phoneNumber:
                    type: string
                    description: Phone number. Unique when set.
                gender:
                    type: integer
                    description: 0男 1女 2未知 (per RuoYi).
                    format: int32
                password:
                    type: string
                    description: 'Write-only: accepted on create/update, never returned. Bcrypt-hashed.'
                status:
                    type: integer
                    description: 0正常 1停用 (per RuoYi).
                    format: int32
                avatar:
                    type: string
                    description: |-
                        The user's avatar as a Stored File id (0 = none) — RuoYi's bigint
                         avatar column. Not validated on write; an unresolvable id reads back
                         as an empty avatar_url (ADR 0016).
                remark:
                    type: string
                deptId:
                    type: string
                    description: |-
                        The user's department (部门); 0 = none. Validated through the org
                         module's contract on save: the department must exist and be enabled.
                createBy:
                    type: string
                    description: 'Audit: who created/updated. Filled from the authenticated identity.'
                updateBy:
                    type: string
                loginIp:
                    type: string
                    description: Last login IP/time. Written by the authn module, read-only here.
                loginDate:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                avatarUrl:
                    type: string
                    description: |-
                        Read-only: the avatar's Display URL, freshly presigned on each read
                         (ADR 0016). Empty when the id is unset or unresolvable.
            description: |-
                User is a system user (系统用户), ported from RuoYi sys_user. Back-office
                 CRUD only — login/session lives in the authn module.
        user.v1.UserSet:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/user.v1.User'
                nextPageToken:
                    type: string
                    description: Opaque token for the next page; empty when on the last page.
            description: UserSet is a page of users.
        wechat.v1.CreateWechatAppRequest:
            required:
                - name
                - wxAppId
                - appType
                - appSecret
            type: object
            properties:
                name:
                    type: string
                    description: Required. Display name, at most 64 characters.
                wxAppId:
                    type: string
                    description: Required. WeChat AppID. Unique among apps that are not withdrawn.
                appType:
                    type: integer
                    description: Required. Mini program or official account.
                    format: enum
                accountKind:
                    type: integer
                    description: |-
                        Required for an official account: Service Account or Subscription
                         Account. Must be unset for a mini program.
                    format: enum
                appSecret:
                    type: string
                    description: |-
                        Required. AppSecret. Stored as ciphertext; echoed as a mask. Never
                         returned in full.
        wechat.v1.CreateWechatPlatformRequest:
            required:
                - name
                - componentAppId
                - componentSecret
                - token
                - encodingAesKey
            type: object
            properties:
                name:
                    type: string
                    description: Required. Display name, at most 64 characters.
                componentAppId:
                    type: string
                    description: Required. Component AppID. Unique among platforms that are not withdrawn.
                componentSecret:
                    type: string
                    description: Required. Component secret. Stored as ciphertext; echoed as a mask.
                token:
                    type: string
                    description: Required. Messaging Token.
                encodingAesKey:
                    type: string
                    description: Required. EncodingAESKey.
        wechat.v1.MiniProgramIdentity:
            type: object
            properties:
                openid:
                    type: string
                unionid:
                    type: string
            description: |-
                MiniProgramIdentity is the person as known to that one WeChat App.
                 unionid is empty when WeChat omitted it. session_key is not a field,
                 and neither is a system credential or a Login Session.
        wechat.v1.MiniProgramLoginRequest:
            required:
                - wxAppId
                - code
            type: object
            properties:
                wxAppId:
                    type: string
                    description: |-
                        Required. WeChat AppID of the mini program. The caller does not
                         send the row id or the connection.
                code:
                    type: string
                    description: Required. One-time login code from that mini program.
        wechat.v1.ProbeWechatAppRequest:
            required:
                - appId
            type: object
            properties:
                appId:
                    type: string
                    description: Required. The id of the app to test.
        wechat.v1.ProbeWechatAppResult:
            type: object
            properties:
                ok:
                    type: boolean
                message:
                    type: string
                    description: Human-readable outcome; the failure reason when ok is false.
            description: |-
                ProbeWechatAppResult is one WeChat Connectivity Test. ok is false when
                 the app's token was not proved. A definitive refusal also lapses the
                 app; a timeout, a business rejection, or an unready platform does not.
        wechat.v1.ProbeWechatPlatformRequest:
            required:
                - platformId
            type: object
            properties:
                platformId:
                    type: string
                    description: Required. The id of the platform to test.
        wechat.v1.ProbeWechatPlatformResult:
            type: object
            properties:
                ok:
                    type: boolean
                message:
                    type: string
                    description: Human-readable outcome; the failure reason when ok is false.
            description: |-
                ProbeWechatPlatformResult is one WeChat Connectivity Test. ok is false
                 when the platform cannot yield a token. The test changes no WeChat App.
        wechat.v1.PublishWechatAppMenuRequest:
            required:
                - appId
            type: object
            properties:
                appId:
                    type: string
        wechat.v1.RegenerateWechatAppPushSecretRequest:
            required:
                - appId
            type: object
            properties:
                appId:
                    type: string
                    description: Required. The id of the Direct Hold whose Push Secret is regenerated.
        wechat.v1.SaveWechatAppMenuRequest:
            required:
                - appId
                - menu
            type: object
            properties:
                appId:
                    type: string
                menu:
                    $ref: '#/components/schemas/wechat.v1.WechatCustomMenu'
        wechat.v1.SetWechatAppSuspendedRequest:
            required:
                - appId
            type: object
            properties:
                appId:
                    type: string
                    description: Required. The id of the app.
                suspended:
                    type: boolean
                    description: True suspends the app; false resumes it. Omitted means resume.
        wechat.v1.StartWechatAuthorizationRequest:
            required:
                - platformId
            type: object
            properties:
                platformId:
                    type: string
                    description: Required. The ready platform the grant will bind to.
        wechat.v1.UpdateWechatAppRequest:
            required:
                - appId
                - name
            type: object
            properties:
                appId:
                    type: string
                    description: Required. The id of the app to update.
                name:
                    type: string
                    description: Required. Display name.
                wxAppId:
                    type: string
                    description: |-
                        Optional. Must be empty or equal to the stored WeChat AppID.
                         A different value is refused; the stored value never changes.
                appSecret:
                    type: string
                    description: |-
                        Optional. Blank keeps the stored AppSecret. The response never
                         echoes this value.
        wechat.v1.UpdateWechatPlatformRequest:
            required:
                - platformId
                - name
            type: object
            properties:
                platformId:
                    type: string
                    description: Required. The id of the platform to update.
                name:
                    type: string
                    description: Required. Display name.
                componentAppId:
                    type: string
                    description: |-
                        Optional. Must be empty or equal to the stored component AppID.
                         A different value is refused; the stored value never changes.
                componentSecret:
                    type: string
                    description: Optional. Blank keeps the stored component secret.
                token:
                    type: string
                    description: Optional. Blank keeps the stored Token.
                encodingAesKey:
                    type: string
                    description: Optional. Blank keeps the stored EncodingAESKey.
        wechat.v1.WechatApp:
            type: object
            properties:
                appId:
                    type: string
                    description: Snowflake ID.
                name:
                    type: string
                    description: Display name.
                wxAppId:
                    type: string
                    description: |-
                        WeChat AppID. Immutable for the life of the row. Unique among apps
                         that are not withdrawn, independently of any platform component AppID.
                appType:
                    type: integer
                    format: enum
                accountKind:
                    type: integer
                    description: Empty for a mini program.
                    format: enum
                connection:
                    type: integer
                    format: enum
                appSecretMask:
                    type: string
                    description: Mask of the AppSecret, like "****ab12".
                tokenMask:
                    type: string
                    description: Mask of the Push Secret Token.
                encodingAesKeyMask:
                    type: string
                    description: Mask of the Push Secret EncodingAESKey.
                callbackAddress:
                    type: string
                    description: This app's own callback address.
                suspended:
                    type: boolean
                    description: Suspension is an operator switch. It is not withdrawal.
                keyVersion:
                    type: integer
                    description: Master-key version the ciphertext was written under (ADR 0018).
                    format: int32
                createBy:
                    type: string
                    description: |-
                        Audit: who created/updated. An operator action is the Principal.
                         A Platform Authorization WeChat completed is the system itself (0).
                updateBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                platformId:
                    type: string
                    description: |-
                        The platform a Platform Authorization is bound to. 0 for a Direct Hold.
                         Immutable for the life of the row.
                grantedCapabilities:
                    type: array
                    items:
                        type: integer
                        format: enum
                    description: Capabilities WeChat granted. Empty for a Direct Hold.
                lapsed:
                    type: boolean
                    description: |-
                        Lapse is set when WeChat definitively refuses the grant or the
                         Direct Hold secret. It is not suspension. A lapsed app stays on the
                         live list and cannot be connectivity-tested until it is restored.
            description: |-
                WechatApp is one WeChat App (微信应用). A Direct Hold carries masks for
                 the AppSecret and the Push Secret and never the plaintext (ADR 0029).
                 The generated Token and EncodingAESKey are returned in full only on
                 WechatAppPushSecret. A Platform Authorization carries no authorizer
                 AppSecret and no Push Secret; it is bound to one platform and lists
                 the capabilities WeChat granted.
        wechat.v1.WechatAppMenu:
            type: object
            properties:
                saved:
                    $ref: '#/components/schemas/wechat.v1.WechatCustomMenu'
                accepted:
                    $ref: '#/components/schemas/wechat.v1.WechatCustomMenu'
            description: |-
                WechatAppMenu is the menu an operator can read on one WeChat App.
                 saved is the document kept in this system. accepted is the last menu
                 WeChat accepted; it is empty until a publish succeeds.
        wechat.v1.WechatAppPushSecret:
            type: object
            properties:
                app:
                    $ref: '#/components/schemas/wechat.v1.WechatApp'
                token:
                    type: string
                    description: Messaging Token, in full, this once.
                encodingAesKey:
                    type: string
                    description: EncodingAESKey, in full, this once.
            description: |-
                WechatAppPushSecret is the one response that returns a generated Push
                 Secret in full: the app (masks only) plus the Token and EncodingAESKey
                 just generated. Later reads return WechatApp and never this pair.
        wechat.v1.WechatAppSet:
            type: object
            properties:
                apps:
                    type: array
                    items:
                        $ref: '#/components/schemas/wechat.v1.WechatApp'
                nextPageToken:
                    type: string
                    description: Opaque token for the next page; empty when on the last page.
            description: WechatAppSet is a page of WeChat Apps that are not withdrawn.
        wechat.v1.WechatAuthorization:
            type: object
            properties:
                platformId:
                    type: string
                url:
                    type: string
            description: |-
                WechatAuthorization is the link the other administrator opens. The
                 WeChat App is created later, from what WeChat reports.
        wechat.v1.WechatAuthorizationPlatform:
            type: object
            properties:
                platformId:
                    type: string
                name:
                    type: string
                componentAppId:
                    type: string
            description: |-
                WechatAuthorizationPlatform is one ready platform the operator can
                 choose. It carries no secrets and no masks.
        wechat.v1.WechatAuthorizationPlatformSet:
            type: object
            properties:
                platforms:
                    type: array
                    items:
                        $ref: '#/components/schemas/wechat.v1.WechatAuthorizationPlatform'
        wechat.v1.WechatCustomMenu:
            type: object
            properties:
                buttons:
                    type: array
                    items:
                        $ref: '#/components/schemas/wechat.v1.WechatMenuButton'
            description: |-
                WechatCustomMenu is one menu document, including nested sub-buttons.
                 There is no ceiling of three top-level buttons.
        wechat.v1.WechatMenuButton:
            type: object
            properties:
                name:
                    type: string
                webUrl:
                    type: string
                miniProgramAppId:
                    type: string
                miniProgramPage:
                    type: string
                subButtons:
                    type: array
                    items:
                        $ref: '#/components/schemas/wechat.v1.WechatMenuButton'
            description: |-
                WechatMenuButton is one button of a Custom Menu. A parent holds
                 sub-buttons and does not itself open a page. A leaf sets either a web
                 URL or a mini program, not both.
        wechat.v1.WechatPlatform:
            type: object
            properties:
                platformId:
                    type: string
                    description: Snowflake ID.
                name:
                    type: string
                    description: Display name.
                componentAppId:
                    type: string
                    description: Component AppID. Immutable for the life of the row.
                componentSecretMask:
                    type: string
                    description: Mask of the component secret, like "****ab12".
                tokenMask:
                    type: string
                    description: Mask of the Token.
                encodingAesKeyMask:
                    type: string
                    description: Mask of the EncodingAESKey.
                keyVersion:
                    type: integer
                    description: Master-key version the ciphertext was written under (ADR 0018).
                    format: int32
                createBy:
                    type: string
                    description: |-
                        Audit: who created/updated. Filled from the authenticated identity.
                         A verify ticket pushed by WeChat is stamped as the system itself (0).
                updateBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                ready:
                    type: boolean
                    description: |-
                        True when the registration secrets are stored and a verify ticket is
                         held. The ticket itself is never returned.
                callbackUrl:
                    type: string
                    description: |-
                        This platform's callback address, for pasting into WeChat. The message
                         and event URL is this address with /$APPID$ appended.
            description: |-
                WechatPlatform is one WeChat Platform registration (微信平台). The
                 component secret, Token, and EncodingAESKey never cross the wire —
                 every response carries only their masks (ADR 0029).
        wechat.v1.WechatPlatformSet:
            type: object
            properties:
                platforms:
                    type: array
                    items:
                        $ref: '#/components/schemas/wechat.v1.WechatPlatform'
                nextPageToken:
                    type: string
                    description: Opaque token for the next page; empty when on the last page.
            description: WechatPlatformSet is a page of WeChat Platforms.
tags:
    - name: AuthService
      description: |-
        AuthService owns login/logout for Login Sessions. The user↔role link it
         once hosted moved to access.v1.RoleAssignmentService.
    - name: ConfigService
      description: |-
        ConfigService is the runtime-parameter management service (参数管理). v1
         has no read cache (reads hit the indexed table directly) and deliberately
         no by-key HTTP read — other modules consume values through the in-process
         crossdomain ConfigReader contract, never the wire (docs/modules/param.md).
    - name: DeptService
      description: DeptService is the department CRUD + tree service.
    - name: DictService
      description: |-
        DictService is the dictionary management service: Dict Type and Dict Entry
         CRUD plus the consumption read. v1 has no read cache (reads hit the
         indexed tables directly) and no backend consumer — pages are the only
         client.
    - name: FileService
      description: |-
        FileService is the file management service: accept uploads, serve
         downloads, and withdraw Stored Files. The two transfer operations are
         HTTP-only and hand-written (ADR 0008) — kratos proto generators cannot
         express a multipart upload or a streaming byte response — so they carry no
         google.api.http annotation and their gRPC counterparts intentionally stay
         Unimplemented: relaying up to 100 MiB through one gRPC message would mean
         raising the 4 MiB default limit for no benefit.
    - name: JobService
      description: |-
        JobService is the scheduled-task management service (ADR 0023). Job Log
         rows are write-once at completion: there is no update RPC.
    - name: LoginLogService
      description: |-
        LoginLogService is the read/withdraw view over recorded sign-ins and
         session ends. Rows arrive through authn (ADR 0012); no endpoint creates or
         updates them.
    - name: MenuService
      description: MenuService is the system-menu CRUD + tree service.
    - name: OnlineSessionService
      description: |-
        OnlineSessionService exposes the four RuoYi-compatible Login Session
         management operations. It deliberately has no bulk logout operation.
    - name: OperLogService
      description: |-
        OperLogService is the read/withdraw view over recorded operations. Rows
         arrive through the operlog middleware (ADR 0012); no endpoint creates or
         updates them.
    - name: PayService
      description: |-
        PayService is the payment module's management surface: Merchant Account
         configuration, unified Payment initiation, and Refunds. Channel
         callbacks arrive on the auth-exempt notify route (ADR 0020) — a
         hand-written route, not part of this service.
    - name: PostAssignmentService
      description: |-
        PostAssignmentService owns the user↔post link (**Post Assignment**):
         the two endpoints behind the user editor's post dialog.
    - name: PostService
      description: PostService is the post CRUD service.
    - name: RoleAssignmentService
      description: |-
        RoleAssignmentService owns the user↔role link (**Role Assignment**): the
         three endpoints behind RuoYi's authRole dialog.
    - name: RoleService
      description: RoleService is the system-role CRUD + Menu Grant service.
    - name: UserService
      description: UserService is the system-user CRUD service.
    - name: WechatService
      description: |-
        WechatService is the back-office surface for WeChat Platform
         registration and WeChat Apps. Platform permissions are
         wechat:platform:list, create, update, remove, and probe. App permissions
         are wechat:app:list, create, update, remove, and probe. Mini Program Login
         is not a back-office mutation: it requires no Principal and no menu
         permission. The platform callback is a separate unauthenticated route; it
         is not an RPC.
