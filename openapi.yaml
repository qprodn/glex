                 App is created by this call. Permission: wechat:app:create.
            operationId: WechatService_StartWechatAuthorization
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/wechat.v1.StartWechatAuthorizationRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/wechat.v1.WechatAuthorization'
