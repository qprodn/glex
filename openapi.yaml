                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/audit.v1.OperLogSet'
    /monitor/oper_logs/{operLogId}:
        get:
            tags:
                - OperLogService
