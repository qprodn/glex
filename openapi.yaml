                 the merchant form renders from.
            operationId: PayService_GetChannelSchemas
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pay.v1.GetChannelSchemasResponse'
    /pay/merchant:
        get:
            tags:
                - PayService
            description: |-
                ListMerchantAccounts lists Merchant Accounts with AIP filter/order/
                 page-token. Responses carry masked configs only.
            operationId: PayService_ListMerchantAccounts
            parameters:
                - name: pageSize
                  in: query
                  description: Optional. Page size.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: Optional. Page token from a previous response.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Optional. AIP-160 filter. Supported fields:
                       * `name` (e.g. `name="主店"`, exact)
                       * `channel` (e.g. `channel=1`)
                       * `status` (e.g. `status=0`)
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: |-
                    Optional. AIP-132 order on a pay_merchant_account column, e.g.
                     `id desc` (the default), `created_at`.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pay.v1.MerchantAccountSet'
        post:
            tags:
                - PayService
            description: |-
                CreateMerchantAccount validates the config against the Channel's
                 schema, encrypts it whole (ADR 0018), and records the masked echo.
            operationId: PayService_CreateMerchantAccount
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/pay.v1.CreateMerchantAccountRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pay.v1.MerchantAccount'
    /pay/merchant/{merchantId}:
        get:
            tags:
                - PayService
            description: GetMerchantAccount retrieves one Merchant Account (masked config).
            operationId: PayService_GetMerchantAccount
            parameters:
                - name: merchantId
                  in: path
                  description: Required. The id of the Merchant Account to retrieve.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pay.v1.MerchantAccount'
        delete:
            tags:
                - PayService
            description: |-
                WithdrawMerchantAccount soft-deletes the Merchant Account. In-flight
                 Payments are not blocked — their channel is snapshotted; new ones are.
            operationId: PayService_WithdrawMerchantAccount
            parameters:
                - name: merchantId
                  in: path
                  description: Required. The id of the Merchant Account to withdraw.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
        patch:
            tags:
                - PayService
            description: |-
                UpdateMerchantAccount replaces the display name, remark, and the whole
                 config form; secret fields left blank keep their stored values
                 (schema semantics, ADR 0021).
            operationId: PayService_UpdateMerchantAccount
            parameters:
                - name: merchantId
                  in: path
                  description: Required. The id of the Merchant Account to update.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/pay.v1.UpdateMerchantAccountRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pay.v1.MerchantAccount'
    /pay/merchant/{merchantId}/probe:
        post:
            tags:
                - PayService
            description: |-
                ProbeMerchantAccount runs the Connectivity Test: one cheap
                 authenticated Channel call (WeChat platform-certificate pull; Alipay
                 query of a nonexistent trade), moving no money.
            operationId: PayService_ProbeMerchantAccount
            parameters:
                - name: merchantId
                  in: path
                  description: Required. The id of the Merchant Account to probe.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/pay.v1.ProbeMerchantAccountRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pay.v1.ProbeResult'
    /pay/merchant/{merchantId}/status:
        put:
            tags:
                - PayService
            description: |-
                ChangeMerchantAccountStatus enables or disables a Merchant Account.
                 Disabling stops new Payments only; in-flight ones still settle.
            operationId: PayService_ChangeMerchantAccountStatus
            parameters:
                - name: merchantId
                  in: path
                  description: Required. The id of the Merchant Account.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/pay.v1.ChangeMerchantAccountStatusRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pay.v1.MerchantAccount'
    /pay/payment:
        get:
            tags:
                - PayService
            description: |-
                ListPayments lists Payments with AIP filter/order/page-token. List
                 reads never touch the Channel.
            operationId: PayService_ListPayments
            parameters:
                - name: pageSize
                  in: query
                  description: Optional. Page size.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: Optional. Page token from a previous response.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Optional. AIP-160 filter. Supported fields:
                       * `biz_no` (e.g. `biz_no="ORDER-1"`, exact)
                       * `status` (e.g. `status=1`)
                       * `merchant_id` (e.g. `merchant_id=1000000000000000001`)
                       * `channel` (e.g. `channel=1`)
                       * `created_at` (e.g. `created_at>="2026-01-01T00:00:00Z"`)
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: |-
                    Optional. AIP-132 order on a pay_payment column, e.g. `id desc` (the
                     default), `amount`, `created_at`, `expire_time`, `paid_at`.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pay.v1.PaymentSet'
        post:
            tags:
                - PayService
            description: |-
                CreatePayment initiates one Native Payment: it closes the Merchant
                 Account's still-pending Payments for the Business Order Number, then
                 prepays at the Channel and returns the Payment carrying the QR payload
                 in channel_payload. A concurrent duplicate submit is rejected
                 (LOCK_BUSY / HTTP 409).
            operationId: PayService_CreatePayment
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/pay.v1.CreatePaymentRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pay.v1.Payment'
    /pay/payment/{paymentId}:
        get:
            tags:
                - PayService
            description: |-
                GetPayment retrieves one Payment. A PENDING payment past its expiry
                 settles first (channel-confirmed PAID wins, else EXPIRED).
            operationId: PayService_GetPayment
            parameters:
                - name: paymentId
                  in: path
                  description: Required. The Payment number.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pay.v1.Payment'
    /pay/payment/{paymentId}/close:
        post:
            tags:
                - PayService
            description: |-
                ClosePayment closes a PENDING Payment at the Channel, then locally. A
                 Channel "already paid" answer flips to a query and settles PAID; late
                 close intents on terminal Payments are no-ops.
            operationId: PayService_ClosePayment
            parameters:
                - name: paymentId
                  in: path
                  description: Required. The Payment number to close.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/pay.v1.ClosePaymentRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pay.v1.Payment'
    /pay/payment/{paymentId}/query:
        post:
            tags:
                - PayService
            description: |-
                QueryPayment asks the Channel for the Payment's true state and advances
                 it by CAS — the explicit settlement path when callbacks are lost.
            operationId: PayService_QueryPayment
            parameters:
                - name: paymentId
                  in: path
                  description: Required. The Payment number to query at the Channel.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/pay.v1.QueryPaymentRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pay.v1.Payment'
    /pay/refund:
        get:
            tags:
                - PayService
            description: ListRefunds lists Refunds with AIP filter/order/page-token.
            operationId: PayService_ListRefunds
            parameters:
                - name: pageSize
                  in: query
                  description: Optional. Page size.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: Optional. Page token from a previous response.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Optional. AIP-160 filter. Supported fields:
                       * `payment_id` (e.g. `payment_id=1000000000000000001`)
                       * `merchant_id` (e.g. `merchant_id=1000000000000000001`)
                       * `channel` (e.g. `channel=1`)
                       * `status` (e.g. `status=2`)
                       * `created_at` (e.g. `created_at>="2026-01-01T00:00:00Z"`)
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: |-
                    Optional. AIP-132 order on a pay_refund column, e.g. `id desc` (the
                     default), `amount`, `created_at`.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pay.v1.RefundSet'
        post:
            tags:
                - PayService
            description: |-
                CreateRefund refunds part of a paid Payment under the payment-scoped
                 lock: refunded + amount ≤ paid, or REFUND_EXCEED_LIMIT. WeChat refunds
                 return PENDING (callback settles); Alipay's synchronous refund settles
                 immediately.
            operationId: PayService_CreateRefund
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/pay.v1.CreateRefundRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pay.v1.Refund'
    /pay/refund/{refundId}:
        get:
            tags:
                - PayService
            description: GetRefund retrieves one Refund.
            operationId: PayService_GetRefund
            parameters:
                - name: refundId
                  in: path
                  description: Required. The Refund number.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pay.v1.Refund'
    /pay/refund/{refundId}/query:
        post:
            tags:
                - PayService
            description: |-
                QueryRefund asks the Channel for the Refund's true state and advances
                 it by CAS.
            operationId: PayService_QueryRefund
            parameters:
                - name: refundId
                  in: path
                  description: Required. The Refund number to query at the Channel.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/pay.v1.QueryRefundRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pay.v1.Refund'
    /wechat/app:
        get:
            tags:
                - WechatService
            description: |-
                ListWechatApps lists apps that are not withdrawn. Responses carry
                 masks only.
            operationId: WechatService_ListWechatApps
            parameters:
                - name: pageSize
                  in: query
                  description: Optional. Page size.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: Optional. Page token from a previous response.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Optional. AIP-160 filter. Supported fields:
                       * `name` (e.g. `name="演示小程序"`, exact)
                       * `wx_app_id` (e.g. `wx_app_id="wx123"`)
                       * `app_type` (e.g. `app_type="mini_program"`)
                       * `account_kind` (e.g. `account_kind="service_account"`)
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: Optional. AIP-132 order, e.g. `id desc` (the default).
