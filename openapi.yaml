components:
    schemas:
        system.auth.v1.LoginReply:
            type: object
            properties:
                accessToken:
                    type: string
                expireIn:
                    type: string
                    description: Remaining fixed lifetime in seconds.
            description: |-
                LoginReply returns the bearer credential exactly once, at login. The token
                 is never included in Principal or OnlineSession.
        system.auth.v1.LoginRequest:
            required:
                - username
                - password
            type: object
            properties:
                username:
                    type: string
                password:
                    type: string
            description: LoginRequest contains the credentials used to create one Login Session.
        system.auth.v1.OnlineSession:
            type: object
            properties:
                tokenId:
                    type: string
                userName:
                    type: string
                deviceType:
                    type: string
                ipaddr:
                    type: string
                browser:
                    type: string
                os:
                    type: string
                loginTime:
                    type: string
                    format: date-time
            description: |-
                OnlineSession is the safe management view of one Login Session. token_id is
                 the non-secret Session ID retained for RuoYi-compatible JSON naming.
        system.auth.v1.OnlineSessionSet:
            type: object
            properties:
                sessions:
                    type: array
                    items:
                        $ref: '#/components/schemas/system.auth.v1.OnlineSession'
                nextPageToken:
                    type: string
            description: OnlineSessionSet is a page of active Login Sessions.
        system.menu.v1.Menu:
            type: object
            properties:
                menuId:
                    type: string
                    description: Snowflake ID. Server-assigned on create.
                menuName:
                    type: string
                parentId:
                    type: string
                    description: Parent menu id; 0 = root.
                orderNum:
                    type: integer
                    format: int32
                path:
                    type: string
                    description: |-
                        The routing fields below are inert until the auth module's getRouters
                         consumes them.
                component:
                    type: string
                queryParam:
                    type: string
                isFrame:
                    type: integer
                    description: 0否 1是 (external link).
                    format: int32
                isCache:
                    type: integer
                    description: 0不缓存 1缓存.
                    format: int32
                menuType:
                    type: integer
                    format: enum
                visible:
                    type: integer
                    description: 0显示 1隐藏.
                    format: int32
                status:
                    type: integer
                    description: 0正常 1停用.
                    format: int32
                perms:
                    type: string
                    description: Permission handle (e.g. "system:user:list"); enforced by the auth module.
                icon:
                    type: string
                activeMenu:
                    type: string
                ext:
                    type: string
                createBy:
                    type: string
                    description: Audit; filled by the auth module.
                updateBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/system.menu.v1.Menu'
                    description: 'Read-only: populated by ListMenus (the tree), ignored on Create/Update.'
            description: |-
                Menu is a menu node (菜单), ported from RuoYi sys_menu. Back-office CRUD +
                 tree only; route generation (getRouters) lives in the auth module.
        system.menu.v1.MenuTree:
            type: object
            properties:
                menus:
                    type: array
                    items:
                        $ref: '#/components/schemas/system.menu.v1.Menu'
            description: MenuTree is a forest of root menus, each nesting its descendants.
        system.menu.v1.Router:
            type: object
            properties:
                name:
                    type: string
                path:
                    type: string
                hidden:
                    type: boolean
                redirect:
                    type: string
                component:
                    type: string
                query:
                    type: string
                alwaysShow:
                    type: boolean
                meta:
                    $ref: '#/components/schemas/system.menu.v1.RouterMeta'
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/system.menu.v1.Router'
            description: |-
                Router is one Directory/Menu node in the current System User's route tree.
                 Button nodes are never projected as Router values.
        system.menu.v1.RouterMeta:
            type: object
            properties:
                title:
                    type: string
                icon:
                    type: string
                noCache:
                    type: boolean
                link:
                    type: string
                activeMenu:
                    type: string
            description: RouterMeta contains route presentation metadata consumed by the frontend.
        system.menu.v1.RouterTree:
            type: object
            properties:
                routers:
                    type: array
                    items:
                        $ref: '#/components/schemas/system.menu.v1.Router'
            description: RouterTree is the current System User's route forest.
        system.role.v1.Role:
            type: object
            properties:
                roleId:
                    type: string
                    description: Snowflake ID. Server-assigned on create.
                roleName:
                    type: string
                    description: Role name. Required, non-blank; unique among active roles.
                roleKey:
                    type: string
                    description: |-
                        Permission string (e.g. "superadmin" or "data:scope:read"). Required,
                         non-blank; unique among active roles. No charset rule.
                roleSort:
                    type: integer
                    description: Display order. Defaults to 0; not required (0 is legal).
                    format: int32
                status:
                    type: integer
                    description: 0正常 1停用 (per RuoYi). Ordinary updatable field.
                    format: int32
                remark:
                    type: string
                createBy:
                    type: string
                    description: 'Audit: who created/updated. Filled by the auth module.'
                updateBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                menuCheckStrictly:
                    type: boolean
                    description: |-
                        Whether the role editor treats parent/child menu selection as linked
                         (菜单选择是否关联显示). Defaults to on (RuoYi column default 1). Shown by
                         GetRole/ListRoles; NOT writable through UpdateRole — it is written only
                         via UpdateRoleMenus (the permission save), like Menu.children is
                         read-only on Create/Update.
            description: |-
                Role is a named bundle of permissions (角色), ported from RuoYi sys_role.
                 Back-office CRUD plus the role↔menu link (**Menu Grant**); user↔role and
                 data-scope links are deferred (see CONTEXT.md).
        system.role.v1.RoleMenus:
            type: object
            properties:
                menuIds:
                    type: array
                    items:
                        type: string
            description: 'RoleMenus is a role''s Menu Grant: the full set of granted menu ids.'
        system.role.v1.RoleSet:
            type: object
            properties:
                roles:
                    type: array
                    items:
                        $ref: '#/components/schemas/system.role.v1.Role'
                nextPageToken:
                    type: string
                    description: Opaque token for the next page; empty when on the last page.
            description: RoleSet is a page of roles.
        system.role.v1.UpdateRoleMenusRequest:
            required:
                - roleId
            type: object
            properties:
                roleId:
                    type: string
                    description: Required. The id of the role whose grant is replaced.
                menuIds:
                    type: array
                    items:
                        type: string
                    description: The complete desired grant; full replacement (empty = clear all).
                menuCheckStrictly:
                    type: boolean
                    description: |-
                        Optional. Presence-aware; absent = true (RuoYi default). Written together
                         with the grant in the same transaction.
        system.user.v1.CurrentUser:
            type: object
            properties:
                userId:
                    type: string
                userName:
                    type: string
                nickName:
                    type: string
                email:
                    type: string
                phoneNumber:
                    type: string
                gender:
                    type: integer
                    format: int32
                status:
                    type: integer
                    format: int32
                avatar:
                    type: string
                remark:
                    type: string
                createBy:
                    type: string
                updateBy:
                    type: string
                loginIp:
                    type: string
                loginDate:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                CurrentUser is the read-only, password-free System User shape returned by
                 GetInfo. A distinct DTO makes it impossible to expose the stored hash.
        system.user.v1.CurrentUserInfo:
            type: object
            properties:
                user:
                    $ref: '#/components/schemas/system.user.v1.CurrentUser'
                roleKeys:
                    type: array
                    items:
                        type: string
                permissions:
                    type: array
                    items:
                        type: string
            description: |-
                CurrentUserInfo is the authenticated System User and current Authorization
                 Snapshot exposed to the frontend.
        system.user.v1.User:
            type: object
            properties:
                userId:
                    type: string
                    description: Snowflake ID. Server-assigned on create.
                userName:
                    type: string
                    description: Login account. Unique.
                nickName:
                    type: string
                    description: Display name.
                email:
                    type: string
                    description: Email. Unique when set.
                phoneNumber:
                    type: string
                    description: Phone number. Unique when set.
                gender:
                    type: integer
                    description: 0男 1女 2未知 (per RuoYi).
                    format: int32
                password:
                    type: string
                    description: 'Write-only: accepted on create/update, never returned. Bcrypt-hashed.'
                status:
                    type: integer
                    description: 0正常 1停用 (per RuoYi).
                    format: int32
                avatar:
                    type: string
                    description: Avatar URL. OSS upload is deferred; the column is a placeholder.
                remark:
                    type: string
                createBy:
                    type: string
                    description: 'Audit: who created/updated. Filled by the auth module.'
                updateBy:
                    type: string
                loginIp:
                    type: string
                    description: Last login IP/time. Written by the auth module, read-only here.
                loginDate:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                User is a system user (系统用户), ported from RuoYi sys_user. Back-office
                 CRUD only — login/session lives in the auth module.
        system.user.v1.UserSet:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/system.user.v1.User'
                nextPageToken:
                    type: string
                    description: Opaque token for the next page; empty when on the last page.
            description: UserSet is a page of users.
tags:
    - name: AuthService
      description: AuthService creates and ends Login Sessions.
    - name: MenuService
      description: MenuService is the system-menu CRUD + tree service.
    - name: OnlineSessionService
      description: |-
        OnlineSessionService exposes the four RuoYi-compatible Login Session
         management operations. It deliberately has no bulk logout operation.
    - name: RoleService
      description: RoleService is the system-role CRUD + Menu Grant service.
    - name: UserService
      description: UserService is the system-user CRUD service.
