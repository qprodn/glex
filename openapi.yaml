                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/wechat.v1.WechatAuthorizationPlatformSet'
    /wechat/app/{appId}:
        get:
            tags:
                - WechatService
            description: |-
                GetWechatApp retrieves one app that is not withdrawn. The response
                 carries masks only.
            operationId: WechatService_GetWechatApp
            parameters:
                - name: appId
                  in: path
                  description: Required. The id of the app to retrieve.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/wechat.v1.WechatApp'
        delete:
            tags:
                - WechatService
            description: |-
                WithdrawWechatApp soft-deletes the app. The row leaves the live list;
                 it is not hard-deleted. The same AppID can be connected again as a
                 new row.
            operationId: WechatService_WithdrawWechatApp
            parameters:
                - name: appId
                  in: path
                  description: Required. The id of the app to withdraw.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
        patch:
            tags:
                - WechatService
            description: |-
                UpdateWechatApp corrects the display name and, when app_secret is
                 non-blank, replaces the AppSecret. The response carries masks only
                 and never the submitted secret. A wx_app_id that differs from the
                 stored value is refused.
            operationId: WechatService_UpdateWechatApp
            parameters:
                - name: appId
                  in: path
                  description: Required. The id of the app to update.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/wechat.v1.UpdateWechatAppRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/wechat.v1.WechatApp'
    /wechat/app/{appId}/menu:
        get:
