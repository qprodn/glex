server:
  http:
    addr: 0.0.0.0:8000
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
data:
  database:
    driver: postgres
    # Local dev example only. Supply production credentials through a
    # deployment-specific config source; never commit them here.
    source: postgres://postgres:123456@127.0.0.1:5432/glex?sslmode=disable
  redis:
    addr: 127.0.0.1:6379
    read_timeout: 0.2s
    write_timeout: 0.2s
  # 本副本的雪花节点号（0–1023，全模块共享一个节点）。多副本必须互异，
  # 否则两个副本同毫秒可能铸造相同 ID（主键冲突）；0 取内置默认 1（单实例
  # 历史值）。
  snowflake_node: 1
file:
  s3:
    # Local dev example (MinIO). Supply real credentials through a
    # deployment-specific config source; never commit them here.
    endpoint: 127.0.0.1:9002
    region: us-east-1
    bucket: glex
    access_key: minioadmin
    secret_key: minioadmin
    use_ssl: false
    path_style: true
    # Host browsers use to reach storage when it differs from endpoint
    # (presigned display URLs are signed against this — ADR 0016). Empty =
    # endpoint itself, which local dev can already reach.
    external_endpoint: ""
  # 100 MiB default upload cap.
  max_size_bytes: 104857600
  # Presigned display-URL lifetime (ADR 0016); 0 falls back to 120s.
  presign_ttl_seconds: 120
  # Entries ending in "/*" admit a whole type; others are exact matches.
  # The sniffed type (from the bytes) decides — declared types never do.
  allow_mime:
    - image/*
    - video/*
    - audio/*
    - text/plain
    - text/csv
    - application/json
    - application/pdf
    - application/zip
    - application/x-zip-compressed
    - application/gzip
    - application/x-7z-compressed
    - application/x-rar-compressed
    - application/msword
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.ms-excel
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - application/vnd.ms-powerpoint
    - application/vnd.openxmlformats-officedocument.presentationml.presentation
auth:
  # Seven days, encoded in protobuf Duration text format.
  fixed_lifetime: 604800s
  idle_lifetime: 10800s
  max_sessions_per_user: 5
  username_login_counter:
    max_failures: 5
    window: 600s
  source_ip_login_counter:
    max_failures: 20
    window: 600s
  redis_namespace: glex:auth
  # Assert true only when the service port is private and the exclusive edge
  # proxy replaces the forwarded source-IP header with its authoritative value.
  edge_proxy_authoritative_source_ip: true

# User module (ADR 0017). init_password is the initial credential every
# imported System User receives — a documented weak default (RuoYi's
# sys.user.initPassword lineage) operators must rotate, not a real
# credential. Omit or leave empty for the built-in "123456".
user:
  init_password: "123456"

pay:
  # 渠道回调基础地址（ADR 0020）：/pay/notify/{channel}/{merchant_id} 挂在其后。
  # 上线收款前必须配置为公网可达地址。
  notify_base_url: ""
  # 回调路由每商户每分钟限流，0 取内置默认（60）。
  notify_rate_limit_per_minute: 60

job:
  # 内置调度循环总开关（ADR 0023）：false 完全停止触发——外部调度器接管
  # 之日改此处即可，其余不动。
  enabled: true
  # 调度循环间隔（秒），即触发粒度；0 取内置默认（10）。
  tick_seconds: 10
  # 任务行未单独设置超时的默认运行超时（秒），建行时写入行内；0 取内置
  # 默认（60）。
  default_timeout_seconds: 60
  # 所有 cron 表达式求值的统一时区（IANA 名）——多副本必须一致，因此只来自
  # 配置而非进程本地时区；空取内置默认（Asia/Shanghai）。
  timezone: "Asia/Shanghai"
