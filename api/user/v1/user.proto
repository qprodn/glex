syntax = "proto3";

package user.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "glex/api/user/v1;v1";
option java_multiple_files = true;
option java_package = "api.user.v1";

// User is a system user (系统用户), ported from RuoYi sys_user. Back-office
// CRUD only — login/session lives in the authn module.
message User {
  // Snowflake ID. Server-assigned on create.
  int64 user_id = 1;
  // Login account. Unique.
  string user_name = 2;
  // Display name.
  string nick_name = 3;
  // Email. Unique when set.
  string email = 4;
  // Phone number. Unique when set.
  string phone_number = 5;
  // 0男 1女 2未知 (per RuoYi).
  int32 gender = 6;
  // Write-only: accepted on create/update, never returned. Bcrypt-hashed.
  string password = 7;
  // 0正常 1停用 (per RuoYi).
  int32 status = 8;
  // The user's avatar as a Stored File id (0 = none) — RuoYi's bigint
  // avatar column. Not validated on write; an unresolvable id reads back
  // as an empty avatar_url (ADR 0016).
  int64 avatar = 9;
  string remark = 10;
  // The user's department (部门); 0 = none. Validated through the org
  // module's contract on save: the department must exist and be enabled.
  int64 dept_id = 17;
  // Audit: who created/updated. Filled from the authenticated identity.
  int64 create_by = 11;
  int64 update_by = 12;
  // Last login IP/time. Written by the authn module, read-only here.
  string login_ip = 13;
  google.protobuf.Timestamp login_date = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  // Read-only: the avatar's Display URL, freshly presigned on each read
  // (ADR 0016). Empty when the id is unset or unresolvable.
  string avatar_url = 18;
}

// UserSet is a page of users.
message UserSet {
  repeated User users = 1;
  // Opaque token for the next page; empty when on the last page.
  string next_page_token = 2;
}

// CurrentUser is the read-only, password-free System User shape returned by
// GetInfo. A distinct DTO makes it impossible to expose the stored hash.
message CurrentUser {
  int64 user_id = 1;
  string user_name = 2;
  string nick_name = 3;
  string email = 4;
  string phone_number = 5;
  int32 gender = 6;
  int32 status = 7;
  // Read-only: the avatar's Display URL, freshly presigned on each read
  // (ADR 0016). Empty when the id is unset or unresolvable.
  string avatar_url = 8;
  string remark = 9;
  // The user's department; 0 = none (read-only, same as User.dept_id).
  int64 dept_id = 16;
  // The avatar's Stored File id (read-only, same as User.avatar).
  int64 avatar = 17;
  int64 create_by = 10;
  int64 update_by = 11;
  string login_ip = 12;
  google.protobuf.Timestamp login_date = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

// CurrentUserInfo is the authenticated System User and current Authorization
// Snapshot exposed to the frontend.
message CurrentUserInfo {
  CurrentUser user = 1;
  repeated string role_keys = 2;
  repeated string permissions = 3;
}

// UserService is the system-user CRUD service.
service UserService {
  // GetInfo returns the current System User, Role keys, and Functional
  // Permissions. It is declared before the parameterized GetUser route so the
  // generated HTTP router gives this static path precedence.
  rpc GetInfo(google.protobuf.Empty) returns (CurrentUserInfo) {
    option (google.api.http) = {
      get: "/iam/user/getInfo"
    };
  }
  // CreateUser creates a new system user.
  rpc CreateUser(CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/iam/user"
      body: "user"
    };
  }
  // GetUser retrieves a user by id.
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/iam/user/{user_id}"
    };
  }
  // ListUsers lists users with AIP filter/order/page-token.
  rpc ListUsers(ListUsersRequest) returns (UserSet) {
    option (google.api.http) = {
      get: "/iam/user"
    };
  }
  // UpdateUser partially updates a user (field-mask). Empty password = unchanged.
  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      patch: "/iam/user/{user.user_id}"
      body: "user"
    };
  }
  // DeleteUser soft-deletes a user by id.
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/iam/user/{user_id}"
    };
  }
  // ImportUsers applies a spreadsheet of new System Users from an Import
  // File (ADR 0017): the workbook was uploaded through the file module
  // (business prefix import/user) and is addressed by its Stored File id —
  // never a Display URL. Every row is validated and either all rows are
  // created or none is (all-or-nothing on one transaction); row_errors
  // carries every failure with row and column. Imported users receive the
  // configured initial credential; the sheet never carries passwords.
  // Insert-only: an existing login account is a row error.
  rpc ImportUsers(ImportUsersRequest) returns (ImportUsersResponse) {
    option (google.api.http) = {
      post: "/iam/user/-/import"
      body: "*"
    };
  }
  // ExportUsers streams the filtered users as an xlsx workbook (ADR 0017).
  // HTTP-only, hand-written route — the streaming byte response carries no
  // google.api.http annotation (same shape as the file module's transfers)
  // and the gRPC counterpart stays unimplemented. Nothing is stored: the
  // oper log entry minted for this POST is the only record an export
  // happened.
  rpc ExportUsers(ExportUsersRequest) returns (google.protobuf.Empty);
  // ImportTemplate streams the user import sheet's template — the import
  // columns with headers and no data (ADR 0017). HTTP-only, hand-written
  // route; gRPC stays unimplemented.
  rpc ImportTemplate(ImportTemplateRequest) returns (google.protobuf.Empty);
}

message CreateUserRequest {
  // Required. The user to create.
  User user = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetUserRequest {
  // Required. The id of the user to retrieve.
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListUsersRequest {
  // Optional. Page size.
  int32 page_size = 1;
  // Optional. Page token from a previous response.
  string page_token = 2;
  // Optional. AIP-160 filter. Supported fields:
  //   * `user_name` (e.g. `user_name="admin"`)
  //   * `email` (e.g. `email="a@b.com"`)
  //   * `phone_number` (e.g. `phone_number="13800000000"`)
  //   * `status` (e.g. `status=0`)
  //   * `created_at` range (e.g. `created_at>="2026-01-01T00:00:00Z"`)
  string filter = 3;
  // Optional. AIP-132 order, e.g. `created_at desc` or `user_name`.
  string order_by = 4;
  // Optional. Restrict the listing to this department's subtree (the
  // department itself and every descendant), resolved server-side through
  // the org module; 0 = no restriction. Distinct from the filter's exact
  // fields.
  int64 dept_id = 5;
}

message UpdateUserRequest {
  // Required. The user to update. user_id identifies the record.
  User user = 1 [(google.api.field_behavior) = REQUIRED];
  // Required. Mask of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteUserRequest {
  // Required. The id of the user to delete.
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ImportUsersRequest {
  // Required. The Import File's Stored File id, from the file-module
  // upload (business prefix import/user).
  int64 file_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ImportUsersResponse {
  // Rows created. 0 whenever row_errors is non-empty — all-or-nothing.
  int64 imported_count = 1;
  // Every row-level failure; non-empty means nothing was imported.
  repeated ImportRowError row_errors = 2;
}

message ImportRowError {
  // 1-based sheet row of the failing cell (the header is row 1).
  int32 row = 1;
  // The column's header text.
  string column = 2;
  // Human-readable reason in the operator's language.
  string reason = 3;
}

message ExportUsersRequest {
  // Optional. Restrict the export to this department's subtree, same as
  // ListUsers.
  int64 dept_id = 1;
  // Optional. AIP-160 filter over the same fields as ListUsers.
  string filter = 2;
  // Optional. AIP-132 order, same fields as ListUsers.
  string order_by = 3;
}

message ImportTemplateRequest {}
