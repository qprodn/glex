syntax = "proto3";

package wechat.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "glex/api/wechat/v1;v1";
option java_multiple_files = true;
option java_package = "api.wechat.v1";

// WechatPlatform is one WeChat Platform registration (微信平台). The
// component secret, Token, and EncodingAESKey never cross the wire —
// every response carries only their masks (ADR 0029).
message WechatPlatform {
  // Snowflake ID.
  int64 platform_id = 1;
  // Display name.
  string name = 2;
  // Component AppID. Immutable for the life of the row.
  string component_app_id = 3;
  // Mask of the component secret, like "****ab12".
  string component_secret_mask = 4;
  // Mask of the Token.
  string token_mask = 5;
  // Mask of the EncodingAESKey.
  string encoding_aes_key_mask = 6;
  // Master-key version the ciphertext was written under (ADR 0018).
  int32 key_version = 7;
  // Audit: who created/updated. Filled from the authenticated identity.
  // A verify ticket pushed by WeChat is stamped as the system itself (0).
  int64 create_by = 8;
  int64 update_by = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  // True when the registration secrets are stored and a verify ticket is
  // held. The ticket itself is never returned.
  bool ready = 12;
  // This platform's callback address, for pasting into WeChat. The message
  // and event URL is this address with /$APPID$ appended.
  string callback_url = 13;
}

// WechatPlatformSet is a page of WeChat Platforms.
message WechatPlatformSet {
  repeated WechatPlatform platforms = 1;
  // Opaque token for the next page; empty when on the last page.
  string next_page_token = 2;
}

// WechatAppType says whether a WeChat App is a mini program or an
// official account.
enum WechatAppType {
  WECHAT_APP_TYPE_UNSPECIFIED = 0;
  WECHAT_APP_TYPE_MINI_PROGRAM = 1;
  WECHAT_APP_TYPE_OFFICIAL_ACCOUNT = 2;
}

// WechatAccountKind is the official-account kind. A mini program has
// none. An official account is a Service Account or a Subscription Account.
enum WechatAccountKind {
  WECHAT_ACCOUNT_KIND_UNSPECIFIED = 0;
  WECHAT_ACCOUNT_KIND_SERVICE = 1;
  WECHAT_ACCOUNT_KIND_SUBSCRIPTION = 2;
}

// WechatConnection is how a WeChat App is connected. The connection does
// not change in place (ADR 0029).
enum WechatConnection {
  WECHAT_CONNECTION_UNSPECIFIED = 0;
  WECHAT_CONNECTION_DIRECT_HOLD = 1;
  WECHAT_CONNECTION_PLATFORM_AUTHORIZATION = 2;
}

// WechatCapability is one capability this phase understands. The values
// are names, not WeChat permission-set numbers.
enum WechatCapability {
  WECHAT_CAPABILITY_UNSPECIFIED = 0;
  WECHAT_CAPABILITY_CUSTOM_MENU = 1;
  WECHAT_CAPABILITY_TEMPLATE_MESSAGE = 2;
  WECHAT_CAPABILITY_SUBSCRIBE_NOTIFICATION = 3;
  WECHAT_CAPABILITY_WEB_AUTHORIZATION = 4;
  WECHAT_CAPABILITY_MINI_PROGRAM_LOGIN = 5;
  WECHAT_CAPABILITY_SUBSCRIBE_MESSAGE = 6;
}

// WechatApp is one WeChat App (微信应用). A Direct Hold carries masks for
// the AppSecret and the Push Secret and never the plaintext (ADR 0029).
// The generated Token and EncodingAESKey are returned in full only on
// WechatAppPushSecret. A Platform Authorization carries no authorizer
// AppSecret and no Push Secret; it is bound to one platform and lists
// the capabilities WeChat granted.
message WechatApp {
  // Snowflake ID.
  int64 app_id = 1;
  // Display name.
  string name = 2;
  // WeChat AppID. Immutable for the life of the row. Unique among apps
  // that are not withdrawn, independently of any platform component AppID.
  string wx_app_id = 3;
  WechatAppType app_type = 4;
  // Empty for a mini program.
  WechatAccountKind account_kind = 5;
  WechatConnection connection = 6;
  // Mask of the AppSecret, like "****ab12".
  string app_secret_mask = 7;
  // Mask of the Push Secret Token.
  string token_mask = 8;
  // Mask of the Push Secret EncodingAESKey.
  string encoding_aes_key_mask = 9;
  // This app's own callback address.
  string callback_address = 10;
  // Suspension is an operator switch. It is not withdrawal.
  bool suspended = 11;
  // Master-key version the ciphertext was written under (ADR 0018).
  int32 key_version = 12;
  // Audit: who created/updated. An operator action is the Principal.
  // A Platform Authorization WeChat completed is the system itself (0).
  int64 create_by = 13;
  int64 update_by = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  // The platform a Platform Authorization is bound to. 0 for a Direct Hold.
  // Immutable for the life of the row.
  int64 platform_id = 17;
  // Capabilities WeChat granted. Empty for a Direct Hold.
  repeated WechatCapability granted_capabilities = 18;
}

// WechatAppSet is a page of WeChat Apps that are not withdrawn.
message WechatAppSet {
  repeated WechatApp apps = 1;
  // Opaque token for the next page; empty when on the last page.
  string next_page_token = 2;
}

// WechatAppPushSecret is the one response that returns a generated Push
// Secret in full: the app (masks only) plus the Token and EncodingAESKey
// just generated. Later reads return WechatApp and never this pair.
message WechatAppPushSecret {
  WechatApp app = 1;
  // Messaging Token, in full, this once.
  string token = 2;
  // EncodingAESKey, in full, this once.
  string encoding_aes_key = 3;
}

// WechatService is the back-office surface for WeChat Platform
// registration and WeChat Apps. Platform permissions are
// wechat:platform:list, create, update, remove, and probe. App permissions
// are wechat:app:list, create, update, and remove. The platform callback
// is a separate unauthenticated route; it is not an RPC.
service WechatService {
  // CreateWechatPlatform registers a platform. The response carries masks,
  // never the secrets the operator just typed.
  rpc CreateWechatPlatform(CreateWechatPlatformRequest) returns (WechatPlatform) {
    option (google.api.http) = {
      post: "/wechat/platform"
      body: "*"
    };
  }
  // ListWechatPlatforms lists platforms that are not withdrawn. Responses
  // carry masks only.
  rpc ListWechatPlatforms(ListWechatPlatformsRequest) returns (WechatPlatformSet) {
    option (google.api.http) = {
      get: "/wechat/platform"
    };
  }
  // GetWechatPlatform retrieves one platform that is not withdrawn.
  rpc GetWechatPlatform(GetWechatPlatformRequest) returns (WechatPlatform) {
    option (google.api.http) = {
      get: "/wechat/platform/{platform_id}"
    };
  }
  // UpdateWechatPlatform corrects the display name and, when a secret is
  // non-blank, replaces that secret. A component AppID that differs from
  // the stored value is refused. Blank secrets keep their stored values.
  rpc UpdateWechatPlatform(UpdateWechatPlatformRequest) returns (WechatPlatform) {
    option (google.api.http) = {
      patch: "/wechat/platform/{platform_id}"
      body: "*"
    };
  }
  // WithdrawWechatPlatform soft-deletes the platform. The row leaves the
  // live list; it is not hard-deleted.
  rpc WithdrawWechatPlatform(WithdrawWechatPlatformRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/wechat/platform/{platform_id}"
    };
  }
  // ProbeWechatPlatform runs the WeChat Connectivity Test for one platform.
  // A platform that is missing a secret or a verify ticket fails the test.
  // Success and failure change no WeChat App. Permission: wechat:platform:probe.
  rpc ProbeWechatPlatform(ProbeWechatPlatformRequest) returns (ProbeWechatPlatformResult) {
    option (google.api.http) = {
      post: "/wechat/platform/{platform_id}/probe"
      body: "*"
    };
  }

  // CreateWechatApp connects a mini program, or an official account with
  // a Service Account or Subscription Account kind, by Direct Hold. The
  // response returns the generated Token and EncodingAESKey in full once.
  rpc CreateWechatApp(CreateWechatAppRequest) returns (WechatAppPushSecret) {
    option (google.api.http) = {
      post: "/wechat/app"
      body: "*"
    };
  }
  // ListWechatApps lists apps that are not withdrawn. Responses carry
  // masks only.
  rpc ListWechatApps(ListWechatAppsRequest) returns (WechatAppSet) {
    option (google.api.http) = {
      get: "/wechat/app"
    };
  }
  // GetWechatApp retrieves one app that is not withdrawn. The response
  // carries masks only.
  rpc GetWechatApp(GetWechatAppRequest) returns (WechatApp) {
    option (google.api.http) = {
      get: "/wechat/app/{app_id}"
    };
  }
  // UpdateWechatApp corrects the display name and, when app_secret is
  // non-blank, replaces the AppSecret. The response carries masks only
  // and never the submitted secret. A wx_app_id that differs from the
  // stored value is refused.
  rpc UpdateWechatApp(UpdateWechatAppRequest) returns (WechatApp) {
    option (google.api.http) = {
      patch: "/wechat/app/{app_id}"
      body: "*"
    };
  }
  // SetWechatAppSuspended suspends or resumes the app. The app stays on
  // the live list either way.
  rpc SetWechatAppSuspended(SetWechatAppSuspendedRequest) returns (WechatApp) {
    option (google.api.http) = {
      post: "/wechat/app/{app_id}/suspended"
      body: "*"
    };
  }
  // RegenerateWechatAppPushSecret replaces the Push Secret. The response
  // returns the new pair in full once. The previous pair is invalidated
  // immediately. The app is not withdrawn and its suspension is unchanged.
  rpc RegenerateWechatAppPushSecret(RegenerateWechatAppPushSecretRequest) returns (WechatAppPushSecret) {
    option (google.api.http) = {
      post: "/wechat/app/{app_id}/push-secret"
      body: "*"
    };
  }
  // WithdrawWechatApp soft-deletes the app. The row leaves the live list;
  // it is not hard-deleted. The same AppID can be connected again as a
  // new row.
  rpc WithdrawWechatApp(WithdrawWechatAppRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/wechat/app/{app_id}"
    };
  }

  // ListAuthorizationPlatforms lists ready platforms an operator can
  // choose when starting a Platform Authorization. Withdrawn and unready
  // platforms are omitted. Masks and secrets are not returned. Permission:
  // wechat:app:create.
  rpc ListAuthorizationPlatforms(ListAuthorizationPlatformsRequest) returns (WechatAuthorizationPlatformSet) {
    option (google.api.http) = {
      get: "/wechat/app/authorization/platforms"
    };
  }
  // StartWechatAuthorization returns the link the other administrator
  // opens. The chosen platform must be ready and not withdrawn. No WeChat
  // App is created by this call. Permission: wechat:app:create.
  rpc StartWechatAuthorization(StartWechatAuthorizationRequest) returns (WechatAuthorization) {
    option (google.api.http) = {
      post: "/wechat/app/authorization"
      body: "*"
    };
  }
}

message CreateWechatPlatformRequest {
  // Required. Display name, at most 64 characters.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // Required. Component AppID. Unique among platforms that are not withdrawn.
  string component_app_id = 2 [(google.api.field_behavior) = REQUIRED];
  // Required. Component secret. Stored as ciphertext; echoed as a mask.
  string component_secret = 3 [(google.api.field_behavior) = REQUIRED];
  // Required. Messaging Token.
  string token = 4 [(google.api.field_behavior) = REQUIRED];
  // Required. EncodingAESKey.
  string encoding_aes_key = 5 [(google.api.field_behavior) = REQUIRED];
}

message ListWechatPlatformsRequest {
  // Optional. Page size.
  int32 page_size = 1;
  // Optional. Page token from a previous response.
  string page_token = 2;
  // Optional. AIP-160 filter. Supported fields:
  //   * `name` (e.g. `name="华东平台"`, exact)
  //   * `component_app_id` (e.g. `component_app_id="wx123"`)
  string filter = 3;
  // Optional. AIP-132 order, e.g. `id desc` (the default).
  string order_by = 4;
}

message GetWechatPlatformRequest {
  // Required. The id of the platform to retrieve.
  int64 platform_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateWechatPlatformRequest {
  // Required. The id of the platform to update.
  int64 platform_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Required. Display name.
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  // Optional. Must be empty or equal to the stored component AppID.
  // A different value is refused; the stored value never changes.
  string component_app_id = 3;
  // Optional. Blank keeps the stored component secret.
  string component_secret = 4;
  // Optional. Blank keeps the stored Token.
  string token = 5;
  // Optional. Blank keeps the stored EncodingAESKey.
  string encoding_aes_key = 6;
}

message WithdrawWechatPlatformRequest {
  // Required. The id of the platform to withdraw.
  int64 platform_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ProbeWechatPlatformRequest {
  // Required. The id of the platform to test.
  int64 platform_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ProbeWechatPlatformResult is one WeChat Connectivity Test. ok is false
// when the platform cannot yield a token. The test changes no WeChat App.
message ProbeWechatPlatformResult {
  bool ok = 1;
  // Human-readable outcome; the failure reason when ok is false.
  string message = 2;
}

message CreateWechatAppRequest {
  // Required. Display name, at most 64 characters.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // Required. WeChat AppID. Unique among apps that are not withdrawn.
  string wx_app_id = 2 [(google.api.field_behavior) = REQUIRED];
  // Required. Mini program or official account.
  WechatAppType app_type = 3 [(google.api.field_behavior) = REQUIRED];
  // Required for an official account: Service Account or Subscription
  // Account. Must be unset for a mini program.
  WechatAccountKind account_kind = 4;
  // Required. AppSecret. Stored as ciphertext; echoed as a mask. Never
  // returned in full.
  string app_secret = 5 [(google.api.field_behavior) = REQUIRED];
}

message ListWechatAppsRequest {
  // Optional. Page size.
  int32 page_size = 1;
  // Optional. Page token from a previous response.
  string page_token = 2;
  // Optional. AIP-160 filter. Supported fields:
  //   * `name` (e.g. `name="演示小程序"`, exact)
  //   * `wx_app_id` (e.g. `wx_app_id="wx123"`)
  //   * `app_type` (e.g. `app_type="mini_program"`)
  //   * `account_kind` (e.g. `account_kind="service_account"`)
  string filter = 3;
  // Optional. AIP-132 order, e.g. `id desc` (the default).
  string order_by = 4;
}

message GetWechatAppRequest {
  // Required. The id of the app to retrieve.
  int64 app_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateWechatAppRequest {
  // Required. The id of the app to update.
  int64 app_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Required. Display name.
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  // Optional. Must be empty or equal to the stored WeChat AppID.
  // A different value is refused; the stored value never changes.
  string wx_app_id = 3;
  // Optional. Blank keeps the stored AppSecret. The response never
  // echoes this value.
  string app_secret = 4;
}

message SetWechatAppSuspendedRequest {
  // Required. The id of the app.
  int64 app_id = 1 [(google.api.field_behavior) = REQUIRED];
  // True suspends the app; false resumes it. Omitted means resume.
  bool suspended = 2;
}

message RegenerateWechatAppPushSecretRequest {
  // Required. The id of the Direct Hold whose Push Secret is regenerated.
  int64 app_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message WithdrawWechatAppRequest {
  // Required. The id of the app to withdraw.
  int64 app_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListAuthorizationPlatformsRequest {}

// WechatAuthorizationPlatform is one ready platform the operator can
// choose. It carries no secrets and no masks.
message WechatAuthorizationPlatform {
  int64 platform_id = 1;
  string name = 2;
  string component_app_id = 3;
}

message WechatAuthorizationPlatformSet {
  repeated WechatAuthorizationPlatform platforms = 1;
}

message StartWechatAuthorizationRequest {
  // Required. The ready platform the grant will bind to.
  int64 platform_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// WechatAuthorization is the link the other administrator opens. The
// WeChat App is created later, from what WeChat reports.
message WechatAuthorization {
  int64 platform_id = 1;
  string url = 2;
}
