syntax = "proto3";

package wechat.v1;

option go_package = "glex/api/wechat/v1;v1";
option java_multiple_files = true;
option java_package = "api.wechat.v1";

// ErrorReason is the stable vocabulary for the `reason` field of the error
// body. Values are wire-visible: protojson encodes them as their names, so
// clients branch on the name rather than on an HTTP status. The integer
// tags are internal to the enum; only the names cross the wire.
enum ErrorReason {
  // Unset. Never returned; reserved by proto3 for the zero value.
  ERROR_REASON_UNSPECIFIED = 0;

  // The requested WeChat Platform does not exist or is withdrawn (HTTP 404).
  WECHAT_PLATFORM_NOT_FOUND = 1;
  // A WeChat Platform parameter is invalid: blank name, blank component
  // AppID, missing secret on register, or an over-length value.
  WECHAT_PLATFORM_INVALID = 2;
  // A platform that is not withdrawn already holds this component AppID
  // (HTTP 409).
  WECHAT_PLATFORM_DUPLICATE = 3;
  // The component AppID is fixed for the life of the row.
  WECHAT_PLATFORM_APP_ID_IMMUTABLE = 4;
  // WECHAT_MASTER_KEY is absent or malformed — registration and secret
  // replacement refuse to operate rather than store plaintext (ADR 0029).
  WECHAT_MASTER_KEY_MISSING = 5;
  // The stored ciphertext failed to decrypt or authenticate.
  WECHAT_SECRET_CRYPTO_ERROR = 6;
  // A wechat-store operation failed unexpectedly — the raw database error
  // is logged server-side and this sentinel crosses the boundary (ADR 0007,
  // HTTP 503).
  WECHAT_STORE_UNAVAILABLE = 7;
  // The requested WeChat App does not exist or is withdrawn (HTTP 404).
  WECHAT_APP_NOT_FOUND = 8;
  // A WeChat App parameter is invalid: blank name, blank AppID, missing
  // AppSecret, an official account without a kind, a kind on a mini
  // program, or an over-length value.
  WECHAT_APP_INVALID = 9;
  // An app that is not withdrawn already holds this AppID (HTTP 409).
  // Independent of component-AppID uniqueness on platforms.
  WECHAT_APP_DUPLICATE = 10;
  // The AppID is fixed for the life of the row.
  WECHAT_APP_ID_IMMUTABLE = 11;
  // The app is suspended, so adoption, sending, and menu publishing are refused.
  WECHAT_APP_SUSPENDED = 12;
  // WeChat has definitively refused this app.
  WECHAT_APP_LAPSED = 13;
  // The platform is not ready, so a token-using call is refused.
  WECHAT_PLATFORM_NOT_READY = 14;
  // WeChat timed out or could not be reached. The app is not lapsed.
  WECHAT_UNAVAILABLE = 15;
  // The adopted template does not exist on this app.
  WECHAT_TEMPLATE_NOT_FOUND = 16;
  // This live app already adopted this public-library template.
  WECHAT_TEMPLATE_DUPLICATE = 17;
  // WeChat refused to adopt the library template. No template is stored.
  WECHAT_TEMPLATE_REJECTED = 18;
  // The send has no openid or no adopted template. No dispatch is stored.
  WECHAT_DISPATCH_INVALID = 19;
  // WeChat refused the send. A rejected dispatch is stored without an msgid.
  WECHAT_DISPATCH_REJECTED = 20;
  // The app's kind or granted capabilities do not include this send.
  WECHAT_CAPABILITY_DENIED = 21;
  // A Custom Menu button is not a leaf that opens a web page or a mini
  // program, and not a parent that only holds sub-buttons.
  WECHAT_MENU_INVALID = 22;
  // WeChat did not accept the menu replacement. The app stays unlapsed.
  WECHAT_MENU_REJECTED = 23;
  // This app's kind, or the capabilities a Platform Authorization was
  // granted, cannot perform the call. WeChat is not called.
  WECHAT_CAPABILITY_UNAVAILABLE = 24;
}
