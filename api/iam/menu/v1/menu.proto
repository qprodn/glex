syntax = "proto3";

package iam.menu.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "glex/api/iam/menu/v1;v1";
option java_multiple_files = true;
option java_package = "api.iam.menu.v1";

// MenuType is the kind of a menu node (菜单类型).
enum MenuType {
  MENU_TYPE_UNSPECIFIED = 0;
  MENU_TYPE_DIRECTORY = 1; // 目录 — groups menus
  MENU_TYPE_MENU = 2;      // 菜单 — a routeable page
  MENU_TYPE_BUTTON = 3;    // 按钮 — a permission-gated action
}

// Menu is a menu node (菜单), ported from RuoYi sys_menu. Back-office CRUD +
// tree only; route generation (getRouters) lives in the auth module.
message Menu {
  // Snowflake ID. Server-assigned on create.
  int64 menu_id = 1;
  string menu_name = 2;
  // Parent menu id; 0 = root.
  int64 parent_id = 3;
  int32 order_num = 4;
  // The routing fields below are inert until the auth module's getRouters
  // consumes them.
  string path = 5;
  string component = 6;
  string query_param = 7;
  // 0否 1是 (external link).
  int32 is_frame = 8;
  // 0不缓存 1缓存.
  int32 is_cache = 9;
  MenuType menu_type = 10;
  // 0显示 1隐藏.
  int32 visible = 11;
  // 0正常 1停用.
  int32 status = 12;
  // Permission handle (e.g. "system:user:list"); enforced by the auth module.
  string perms = 13;
  string icon = 14;
  string active_menu = 15;
  string ext = 16;
  // Audit; filled by the auth module.
  int64 create_by = 17;
  int64 update_by = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
  // Read-only: populated by ListMenus (the tree), ignored on Create/Update.
  repeated Menu children = 21;
}

// MenuTree is a forest of root menus, each nesting its descendants.
message MenuTree {
  repeated Menu menus = 1;
}

// RouterMeta contains route presentation metadata consumed by the frontend.
message RouterMeta {
  string title = 1;
  string icon = 2;
  bool no_cache = 3;
  string link = 4;
  string active_menu = 5;
}

// Router is one Directory/Menu node in the current System User's route tree.
// Button nodes are never projected as Router values.
message Router {
  string name = 1;
  string path = 2;
  bool hidden = 3;
  string redirect = 4;
  string component = 5;
  string query = 6;
  bool always_show = 7;
  RouterMeta meta = 8;
  repeated Router children = 9;
}

// RouterTree is the current System User's route forest.
message RouterTree {
  repeated Router routers = 1;
}

// MenuService is the system-menu CRUD + tree service.
service MenuService {
  // GetRouters returns the current System User's route tree. It is declared
  // before the parameterized GetMenu route so the generated HTTP router gives
  // this static path precedence.
  rpc GetRouters(google.protobuf.Empty) returns (RouterTree) {
    option (google.api.http) = {
      get: "/iam/menu/getRouters"
    };
  }
  // CreateMenu creates a new menu.
  rpc CreateMenu(CreateMenuRequest) returns (Menu) {
    option (google.api.http) = {
      post: "/iam/menu"
      body: "menu"
    };
  }
  // GetMenu retrieves a menu by id.
  rpc GetMenu(GetMenuRequest) returns (Menu) {
    option (google.api.http) = {
      get: "/iam/menu/{menu_id}"
    };
  }
  // ListMenus returns the full menu tree. Not paginated (menus are small and
  // tree-shaped). Supports AIP-160 filter and AIP-132 order.
  rpc ListMenus(ListMenusRequest) returns (MenuTree) {
    option (google.api.http) = {
      get: "/iam/menu"
    };
  }
  // UpdateMenu partially updates a menu (field-mask).
  rpc UpdateMenu(UpdateMenuRequest) returns (Menu) {
    option (google.api.http) = {
      patch: "/iam/menu/{menu.menu_id}"
      body: "menu"
    };
  }
  // DeleteMenu soft-deletes a menu by id; refused while it has children.
  rpc DeleteMenu(DeleteMenuRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/iam/menu/{menu_id}"
    };
  }
}

message CreateMenuRequest {
  // Required. The menu to create.
  Menu menu = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetMenuRequest {
  // Required. The id of the menu to retrieve.
  int64 menu_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListMenusRequest {
  // Optional. AIP-160 filter. Supported fields:
  //   * `menu_name` (e.g. `menu_name="系统"`)
  //   * `status` (e.g. `status=0`)
  //   * `visible` (e.g. `visible=0`)
  //   * `menu_type` (e.g. `menu_type=2`)
  //   * `parent_id` (e.g. `parent_id=0`)
  string filter = 1;
  // Optional. AIP-132 order, e.g. `order_num` or `parent_id, order_num`.
  string order_by = 2;
}

message UpdateMenuRequest {
  // Required. The menu to update. menu_id identifies the record.
  Menu menu = 1 [(google.api.field_behavior) = REQUIRED];
  // Required. Mask of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteMenuRequest {
  // Required. The id of the menu to delete.
  int64 menu_id = 1 [(google.api.field_behavior) = REQUIRED];
}
