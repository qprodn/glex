syntax = "proto3";

package system.role.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "glex/api/system/role/v1;v1";
option java_multiple_files = true;
option java_package = "api.system.role.v1";

// Role is a named bundle of permissions (角色), ported from RuoYi sys_role.
// Back-office CRUD only — no associations with other tables yet: role↔menu,
// user↔role and data-scope links are deferred (see CONTEXT.md).
message Role {
  // Snowflake ID. Server-assigned on create.
  int64 role_id = 1;
  // Role name. Required, non-blank; unique among active roles.
  string role_name = 2;
  // Permission string (e.g. "superadmin" or "data:scope:read"). Required,
  // non-blank; unique among active roles. No charset rule.
  string role_key = 3;
  // Display order. Defaults to 0; not required (0 is legal).
  int32 role_sort = 4;
  // 0正常 1停用 (per RuoYi). Ordinary updatable field.
  int32 status = 5;
  string remark = 6;
  // Audit: who created/updated. Filled by the auth module.
  int64 create_by = 7;
  int64 update_by = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// RoleSet is a page of roles.
message RoleSet {
  repeated Role roles = 1;
  // Opaque token for the next page; empty when on the last page.
  string next_page_token = 2;
}

// RoleService is the system-role CRUD service.
service RoleService {
  // CreateRole creates a new role.
  rpc CreateRole(CreateRoleRequest) returns (Role) {
    option (google.api.http) = {
      post: "/system/role"
      body: "role"
    };
  }
  // GetRole retrieves a role by id.
  rpc GetRole(GetRoleRequest) returns (Role) {
    option (google.api.http) = {
      get: "/system/role/{role_id}"
    };
  }
  // ListRoles lists roles with AIP filter/order/page-token.
  rpc ListRoles(ListRolesRequest) returns (RoleSet) {
    option (google.api.http) = {
      get: "/system/role"
    };
  }
  // UpdateRole partially updates a role (field-mask).
  rpc UpdateRole(UpdateRoleRequest) returns (Role) {
    option (google.api.http) = {
      patch: "/system/role/{role.role_id}"
      body: "role"
    };
  }
  // DeleteRole soft-deletes a role by id.
  rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/system/role/{role_id}"
    };
  }
}

message CreateRoleRequest {
  // Required. The role to create.
  Role role = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetRoleRequest {
  // Required. The id of the role to retrieve.
  int64 role_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListRolesRequest {
  // Optional. Page size.
  int32 page_size = 1;
  // Optional. Page token from a previous response.
  string page_token = 2;
  // Optional. AIP-160 filter. Supported fields:
  //   * `role_name` (e.g. `role_name="超级管理员"`)
  //   * `role_key` (e.g. `role_key="superadmin"`)
  //   * `status` (e.g. `status=0`)
  string filter = 3;
  // Optional. AIP-132 order, e.g. `role_sort` or `role_sort, role_id`.
  string order_by = 4;
}

message UpdateRoleRequest {
  // Required. The role to update. role_id identifies the record.
  Role role = 1 [(google.api.field_behavior) = REQUIRED];
  // Required. Mask of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteRoleRequest {
  // Required. The id of the role to delete.
  int64 role_id = 1 [(google.api.field_behavior) = REQUIRED];
}
