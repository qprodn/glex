syntax = "proto3";
package kratos.api;

option go_package = "glex/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
  File file = 4;
}

// Auth configures Login Session lifetimes, concurrency, login throttling, and
// the deployment trust boundary used to derive the authoritative source IP.
message Auth {
  message LoginCounter {
    uint32 max_failures = 1;
    google.protobuf.Duration window = 2;
  }

  google.protobuf.Duration fixed_lifetime = 1;
  google.protobuf.Duration idle_lifetime = 2;
  uint32 max_sessions_per_user = 3;
  LoginCounter username_login_counter = 4;
  LoginCounter source_ip_login_counter = 5;
  // Prefix for project-owned auth keys; it is not a general Redis keyspace.
  string redis_namespace = 6;
  // Deployment assertion: the service port is unreachable directly and the
  // exclusive edge proxy replaces the forwarded source-IP header.
  bool edge_proxy_authoritative_source_ip = 7;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}

// File configures the file module: one S3-compatible endpoint with static
// credentials (ADR 0007) plus the upload acceptance policy (size cap and
// content-type whitelist).
message File {
  message S3 {
    // Host or host:port of the S3-compatible endpoint; the scheme comes from
    // use_ssl.
    string endpoint = 1;
    string region = 2;
    string bucket = 3;
    string access_key = 4;
    string secret_key = 5;
    bool use_ssl = 6;
    // Path-style addressing (true for MinIO and most self-hosted S3).
    bool path_style = 7;
  }
  S3 s3 = 1;
  // Upload size cap in bytes. 0 falls back to the built-in default.
  uint64 max_size_bytes = 2;
  // Accepted content types, sniffed from the upload's bytes — a client's
  // declared Content-Type never overrides the sniffed value. An entry ending
  // in "/*" admits the whole type (e.g. "image/*"); any other entry is an
  // exact match. Empty falls back to the built-in default set.
  repeated string allow_mime = 3;
}
