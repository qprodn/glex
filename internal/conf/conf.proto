syntax = "proto3";
package kratos.api;

option go_package = "glex/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
}

// Auth configures Login Session lifetimes, concurrency, login throttling, and
// the deployment trust boundary used to derive the authoritative source IP.
message Auth {
  message LoginCounter {
    uint32 max_failures = 1;
    google.protobuf.Duration window = 2;
  }

  google.protobuf.Duration fixed_lifetime = 1;
  google.protobuf.Duration idle_lifetime = 2;
  uint32 max_sessions_per_user = 3;
  LoginCounter username_login_counter = 4;
  LoginCounter source_ip_login_counter = 5;
  // Prefix for project-owned auth keys; it is not a general Redis keyspace.
  string redis_namespace = 6;
  // Deployment assertion: the service port is unreachable directly and the
  // exclusive edge proxy replaces the forwarded source-IP header.
  bool edge_proxy_authoritative_source_ip = 7;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}
